// ---------------------------------------------------------------- save and continue
// One save slot (localStorage "grubdef_save"): the board as it stood when the current wave started (field, nodes, units,
// enemies still out, gold, upgrades and the run's counters). A snapshot is taken as every wave starts (startWave); quitting
// during the countdown before a wave saves the board as it is. Continuing restores it, then a short countdown and the
// wave starts as normal. The slot is cleared when a continued run ends.
const SAVE_KEY = "grubdef_save";
const SNAP_KEYS = ["wave", "hp", "maxHp", "gold", "summonCount", "expandCount", "loot", "pendingRewards", "waveExtras", "enemyCap", "bossTime", "bossLeft",
  "lootBonus", "damageBonus", "heldBuildings", "upgrades", "charms", "pity", "goldFrac", "nodeHint", "itemsFound", "pendingEntries", "clock", "spawnList", "overTime", "expandEcho"];
function takeSnap() {
  const d = {};
  for (const k of SNAP_KEYS) d[k] = S[k];
  d.field = [...S.board.field]; d.nodes = [...S.board.nodes.values()]; d.burrow = S.burrow;
  d.towers = [...S.towers.values()].map(t => ({ building: t.building, type: t.type, tier: t.tier, level: t.level, count: t.count, x: t.x, y: t.y }));
  d.enemies = S.enemies.filter(e => e.hp > 0); d.bossIdx = d.enemies.indexOf(S.boss);
  return JSON.parse(JSON.stringify(d));
}
function saveGame() {
  const snap = !S.waveLive || !S.snap ? takeSnap() : S.snap; // in the countdown before a wave, the board as it is IS the wave start
  try { localStorage.setItem(SAVE_KEY, JSON.stringify({ v: 1, at: Date.now(), snap })); return true; } catch (_) { return false; }
}
function loadSave() {
  try { const s = JSON.parse(localStorage.getItem(SAVE_KEY) || "null"); return s && s.v === 1 && s.snap && s.snap.field ? s : null; } catch (_) { return null; }
}
function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (_) {} }
function continueGame() {
  const sv = loadSave();
  newGame();
  if (!sv) return;
  try {
    const d = sv.snap;
    for (const k of SNAP_KEYS) if (d[k] !== undefined) S[k] = d[k];
    const b = new Board(1, 1);
    b.field = new Set(d.field); b.nodes = new Map(d.nodes.map(n => [K(n.x, n.y), { ...n, born: time }]));
    b.rebuild(); b.rebase(d.burrow); // the loop restarts at the burrow, as it did in the saved run
    S.board = b; S.burrow = b.path.at(0);
    S.towers = new Map(d.towers.map(t => [K(t.x, t.y), { ...t, cooldown: 0, pop: 1 }]));
    S.enemies = d.enemies; S.boss = d.bossIdx >= 0 ? S.enemies[d.bossIdx] : null;
    S.phase = "combat"; S.waveLive = false; S.prep = S.prepFull = CFG.resumePrep; S.waveTime = 0; S.resumed = true;
    toast(`Welcome back! Wave ${S.wave} starts in ${CFG.resumePrep}s.`);
  } catch (_) { newGame(); toast("The save couldn't be loaded: started a new run."); }
}
// Quit: ask first (the run is paused), then save and go to the menu.
function askQuit() {
  if (["over", "menu", "choosing", "shop"].includes(S.phase)) return;
  const back = S.phase, had = !!loadSave(), w = !S.waveLive || !S.snap ? S.wave : S.snap.wave;
  S.phase = "choosing"; S.expandMode = false; S.selected = null;
  openModal("Save and quit?", `Your board is saved as it was when wave ${w} started: anything you do from then on is lost.${had ? "\nThis replaces your earlier save." : ""}`, [
    { label: "Keep playing", onClick: () => { S.phase = back; closeModal(); } },
    { label: "Save and quit", primary: true, onClick: () => { if (saveGame()) openMenu(); else { S.phase = back; closeModal(); toast("Couldn't save: browser storage is blocked."); } } },
  ]);
}

// ---------------------------------------------------------------- start menu
function openMenu() {
  closeModal(); closeShop();
  S.phase = "menu"; S.selected = null;
  const grub = `<svg viewBox="0 0 150 70" aria-hidden="true">
      <g><circle class="seg" cx="34" cy="42" r="16" fill="#e7cfe0" stroke="#9b6f8e" stroke-width="3"/>
      <circle class="seg" cx="62" cy="38" r="20" fill="#e7cfe0" stroke="#9b6f8e" stroke-width="3"/>
      <circle class="seg" cx="98" cy="34" r="25" fill="#e7cfe0" stroke="#9b6f8e" stroke-width="3"/></g>
      <circle cx="106" cy="28" r="3.5" fill="#3a2a1c"/><path d="M96 40 q8 7 16 0" fill="none" stroke="#9b6f8e" stroke-width="3" stroke-linecap="round"/></svg>`;
  const el = document.getElementById("menu"), save = loadSave();
  el.innerHTML = `<div class="inner">${grub}
    <h1>Grub Defense</h1>
    <p>Summon, stack and merge defenders. Grow the battlefield. Waves arrive every ${CFG.waveDuration}s: keep the board under ${CFG.enemyCap} grubs.</p>
    <div class="meta">Loot <b>${META.loot}</b></div>
    ${save ? `<button class="primary" data-continue>Continue · wave ${save.snap.wave}</button><button class="secondary" data-play>New run</button>` : `<button class="primary" data-play>Play</button>`}
    <div class="pair"><button class="secondary" data-sound>Sound: ${META.mute ? "off" : "on"}</button><button class="secondary" data-feedback>Feedback</button></div></div>`;
  // Workshop, Research and Artifacts are hidden for now (not ready): put this row back under Play to bring them back
  // <div class="trio"><button class="secondary" data-workshop>Workshop</button><button class="secondary" data-research>Research</button><button class="secondary" data-artifacts>Artifacts</button></div>
  el.hidden = false;
  el.querySelector("button.primary").focus();
}
document.getElementById("menu").addEventListener("click", ev => {
  const b = ev.target.closest("button");
  if (!b) return;
  if ("play" in b.dataset) newGame();
  else if ("continue" in b.dataset) continueGame();
  else if ("sound" in b.dataset) { META.mute = !META.mute; saveMeta(); b.textContent = `Sound: ${META.mute ? "off" : "on"}`; }
  else if ("feedback" in b.dataset) openFeedback();
  else for (const v of ["workshop", "research", "artifacts"]) if (v in b.dataset) { document.getElementById("menu").hidden = true; openShop(v); }
});

// ---------------------------------------------------------------- feedback form
// A full-frame panel that embeds the Google Form set in CFG.feedbackUrl (any form link works: "?embedded=true" is added).
// The run is paused while it's open. With no URL set, the panel says so instead of showing a form.
let feedbackOpen = false;
function openFeedback() {
  const url = CFG.feedbackUrl.trim(), body = $("fbBody"), link = $("fbLink");
  if (url) {
    const src = /[?&]embedded=true/.test(url) ? url : url + (url.includes("?") ? "&" : "?") + "embedded=true";
    body.innerHTML = `<iframe title="Feedback form" src="${src}">Loading…</iframe>`;
    link.href = url; link.hidden = false;
  } else {
    body.innerHTML = `<div class="empty">The feedback form isn't set up yet.<br>Set CFG.feedbackUrl to a Google Form link.</div>`;
    link.hidden = true;
  }
  $("feedback").hidden = false; feedbackOpen = true;
  $("fbClose").focus();
}
function closeFeedback() { $("feedback").hidden = true; $("fbBody").innerHTML = ""; feedbackOpen = false; }
$("fbClose").addEventListener("click", closeFeedback);
$("shop").addEventListener("click", ev => {
  const b = ev.target.closest("button");
  if (!b || b.disabled) return;
  const d = b.dataset;
  if (d.buy) {
    const w = WORKSHOP[d.buy], l = wl(d.buy), c = w.cost(l);
    if (META.loot >= c && l < w.max) { META.loot -= c; META.workshop[d.buy] = l + 1; }
  } else if (d.unlock) {
    const a = ARTIFACTS[d.unlock];
    if (META.loot >= a.unlock) { META.loot -= a.unlock; META.artifacts[d.unlock] = 1; if (META.equipped.length < ARTIFACT_SLOTS) META.equipped.push(d.unlock); }
  } else if (d.up) {
    const a = ARTIFACTS[d.up], l = META.artifacts[d.up], c = a.upCost(l);
    if (META.loot >= c && l < a.max) { META.loot -= c; META.artifacts[d.up] = l + 1; }
  } else if (d.equip) {
    const i = META.equipped.indexOf(d.equip);
    if (i >= 0) META.equipped.splice(i, 1); else if (META.equipped.length < ARTIFACT_SLOTS) META.equipped.push(d.equip);
  } else if (d.research) {
    const r = RESEARCH[d.research], l = rl(d.research), c = r.cost(l);
    if (META.loot >= c && l < r.max && !(r.needs && !rl(r.needs))) { META.loot -= c; META.research[d.research] = l + 1; }
  } else if ("menu" in d) { openMenu(); return; }
  saveMeta(); renderShop();
});

// ---------------------------------------------------------------- input
els.summon.addEventListener("click", summon);
els.expand.addEventListener("click", () => { S.expandEcho = false; if (S.phase !== "build" && !(S.mode === "timed" && S.phase === "combat")) return; S.expandMode = !S.expandMode; S.selected = null; });
// the buttons over the selected unit: Sell one unit, Merge the stack, or Craft a recipe
els.ubtns.addEventListener("click", ev => {
  const b = ev.target.closest("button");
  if (!b || b.disabled) return;
  if ("sell" in b.dataset) sell(); else if ("merge" in b.dataset) merge();
});
// the info pill's tags open (or close) their description
els.info.addEventListener("click", ev => {
  const b = ev.target.closest("button[data-tag]");
  if (b) S.infoTag = S.infoTag === b.dataset.tag ? null : b.dataset.tag;
});
// cycles through the speeds Research has unlocked
els.speed.addEventListener("click", () => { const sp = speeds(); S.speed = sp[(sp.indexOf(S.speed) + 1) % sp.length]; });
els.sound.addEventListener("click", () => { META.mute = !META.mute; saveMeta(); }); // the click tick plays when sound is turned on
els.fb.addEventListener("click", openFeedback);
els.quit.addEventListener("click", askQuit);
els.upgBtn.addEventListener("click", () => { els.upg.hidden = !els.upg.hidden; els.gam.hidden = true; delete cache.upg; });
els.gamBtn.addEventListener("click", () => { els.gam.hidden = !els.gam.hidden; els.upg.hidden = true; delete cache.gam; });
els.gam.addEventListener("click", ev => {
  const b = ev.target.closest("button");
  if (!b || b.disabled) return;
  if (b.dataset.gamble) gamble(b.dataset.gamble, b);
  else if ("close" in b.dataset) els.gam.hidden = true;
});
els.upg.addEventListener("click", ev => {
  const b = ev.target.closest("button");
  if (!b || b.disabled) return;
  if (b.dataset.up) buyUpgrade(b.dataset.up);
  else if ("close" in b.dataset) els.upg.hidden = true;
});

function pointerCell(ev) {
  const r = canvas.getBoundingClientRect();
  const w = toWorld((ev.clientX - r.left) * W / r.width, (ev.clientY - r.top) * H / r.height); // screen px -> frame units
  return { world: w, cell: [Math.floor(w[0]), Math.floor(w[1])] };
}
// Pointer position in frame units (the same units as W and H).
function framePt(ev) { const r = canvas.getBoundingClientRect(); return [(ev.clientX - r.left) * W / r.width, (ev.clientY - r.top) * H / r.height]; }
// The view: a drag on empty space pans (a tap there still deselects or buys the tile), a middle or right drag pans from
// anywhere, two fingers pinch-zoom and pan, and the wheel zooms at the cursor. A drag that starts on a unit moves it.
const pts = new Map(); // pointers currently down on the board, in frame units
let pinch = null, panned = false; // pinch: the last two-finger distance and midpoint; panned: the last press moved the view
const mid = () => { const [a, b] = [...pts.values()]; return { d: Math.hypot(a[0] - b[0], a[1] - b[1]) || 1, x: (a[0] + b[0]) / 2, y: (a[1] + b[1]) / 2 }; };
canvas.addEventListener("pointerdown", ev => {
  if (S.phase === "over" || S.phase === "choosing" || S.phase === "shop" || S.phase === "menu") return;
  pts.set(ev.pointerId, framePt(ev)); panned = false;
  if (pts.size >= 2) { S.drag = null; S.pan = null; pinch = mid(); return; } // a second finger turns whatever the first began into a pinch
  const { world, cell } = pointerCell(ev), k = K(cell[0], cell[1]);
  canvas.setPointerCapture(ev.pointerId);
  if (ev.button === 1 || ev.button === 2) { S.pan = { moved: true, last: framePt(ev) }; return; }
  if (S.expandMode && S.board.isExpandable(cell[0], cell[1])) {
    S.pan = { moved: false, sx: ev.clientX, sy: ev.clientY, last: framePt(ev), tap: () => { buyExpansion(cell[0], cell[1]); S.selected = null; } };
  } else if (S.towers.has(k)) {
    S.expandMode = false;
    S.drag = { from: k, sx: ev.clientX, sy: ev.clientY, moved: false, world };
  } else S.pan = { moved: false, sx: ev.clientX, sy: ev.clientY, last: framePt(ev), tap: () => { S.selected = null; S.expandMode = false; } };
});
canvas.addEventListener("pointermove", ev => {
  if (pts.has(ev.pointerId)) pts.set(ev.pointerId, framePt(ev));
  if (pinch && pts.size >= 2) { // pinch: zoom about the midpoint and follow it
    const m = mid(); zoomAt(m.d / pinch.d, m.x, m.y); panBy(m.x - pinch.x, m.y - pinch.y); pinch = m; panned = true; return;
  }
  if (S.pan) {
    const p = S.pan;
    if (!p.moved && Math.hypot(ev.clientX - p.sx, ev.clientY - p.sy) > 8) p.moved = true;
    if (p.moved) { const f = framePt(ev); panBy(f[0] - p.last[0], f[1] - p.last[1]); p.last = f; panned = true; }
    return;
  }
  if (!S.drag) return;
  if (!S.drag.moved && Math.hypot(ev.clientX - S.drag.sx, ev.clientY - S.drag.sy) > 8) S.drag.moved = true;
  if (S.drag.moved) S.drag.world = pointerCell(ev).world;
});
function endDrag(ev) {
  pts.delete(ev.pointerId);
  if (pts.size < 2) pinch = null;
  if (S.pan) { const p = S.pan; S.pan = null; if (!p.moved && p.tap && !panned) p.tap(); return; }
  if (!S.drag) return;
  const d = S.drag; S.drag = null;
  if (!S.towers.has(d.from)) return;
  if (d.moved) {
    const { cell } = pointerCell(ev);
    if (S.board.has(cell[0], cell[1]) && K(cell[0], cell[1]) !== d.from) moveTower(d.from, cell[0], cell[1]);
  } else S.selected = S.selected === d.from ? null : d.from;
}
canvas.addEventListener("pointerup", endDrag);
canvas.addEventListener("pointercancel", ev => { pts.delete(ev.pointerId); pinch = null; S.drag = null; S.pan = null; });
canvas.addEventListener("contextmenu", ev => { ev.preventDefault(); if (!panned) S.selected = null; });
canvas.addEventListener("wheel", ev => { ev.preventDefault(); const p = framePt(ev); zoomAt(Math.exp(-Math.max(-200, Math.min(200, ev.deltaY)) * 0.0015), p[0], p[1]); }, { passive: false });
$("zIn").addEventListener("click", () => zoomAt(1.3, W / 2, H / 2));
$("zOut").addEventListener("click", () => zoomAt(1 / 1.3, W / 2, H / 2));
$("zFit").addEventListener("click", resetView);

// ---------------------------------------------------------------- main loop
let last = performance.now(), firstFrame = true;
function frame(now) {
  const rdt = Math.min(0.05, (now - last) / 1000); last = now; time += rdt;
  if (feedbackOpen) { /* the feedback form pauses the run */ }
  else if (S.phase === "combat") {
    // sub-step at higher speeds for stable combat
    const steps = S.speed * CFG.baseSpeed;
    for (let i = 0; i < steps && S.phase === "combat"; i++) tickCombat(rdt);
  } else tickIdle(rdt * CFG.baseSpeed);
  for (let i = S.flashes.length - 1; i >= 0; i--) if ((S.flashes[i].ttl -= rdt) <= 0) S.flashes.splice(i, 1);
  for (let i = S.hits.length - 1; i >= 0; i--) if ((S.hits[i].ttl -= rdt) <= 0) S.hits.splice(i, 1);
  for (let i = S.corpses.length - 1; i >= 0; i--) if ((S.corpses[i].ttl -= rdt) <= 0) S.corpses.splice(i, 1);
  for (const t of S.towers.values()) if (t.atkT) t.atkT = Math.max(0, t.atkT - rdt * 6);
  for (const t of S.towers.values()) { // units walk to their tile at a steady pace
    if (!t.vis) continue;
    const c = center(t.x, t.y), dx = c[0] - t.vis[0], dy = c[1] - t.vis[1], d = Math.hypot(dx, dy), step = 4 * rdt;
    if (d <= step) t.vis = c; else { t.vis[0] += dx / d * step; t.vis[1] += dy / d * step; }
  }
  for (let i = S.coins.length - 1; i >= 0; i--) { // pop up, bounce once, fade
    const c = S.coins[i];
    c.vz -= 9 * rdt; c.z += c.vz * rdt; c.x += c.vx * rdt * 0.4;
    if (c.z < 0) { c.z = 0; c.vz = -c.vz * 0.35; }
    if ((c.ttl -= rdt) <= 0) S.coins.splice(i, 1);
  }
  for (let i = S.toasts.length - 1; i >= 0; i--) if ((S.toasts[i].ttl -= rdt) <= 0) S.toasts.splice(i, 1);
  if (W > 0) { fitCamera(rdt, firstFrame); firstFrame = false; draw(); drawFlyers(); }
  updateHUD();
  requestAnimationFrame(frame);
}

newGame();
openMenu(); // the game opens on the start menu
fitFrame(); resize();
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
