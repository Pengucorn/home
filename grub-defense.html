<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grub Defense — prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #dfe7d6;
  --surface: #f3f6ee;
  --text: #1f2b19;
  --muted: #5b6a52;
  --line: #c3cfb7;
  --primary: #d98f1f;
  --primary-text: #2a1a03;
  --danger: #b8323d;
  --board: #cdd8c1;
  --backdrop: #aeb9a3;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #172014; --surface: #222d1d; --text: #e4ecdb; --muted: #9aab8e;
    --line: #34432c; --primary: #e9a43a; --primary-text: #241503; --danger: #e0606a;
    --board: #1b2617; --backdrop: #0b1009; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #172014; --surface: #222d1d; --text: #e4ecdb; --muted: #9aab8e;
  --line: #34432c; --primary: #e9a43a; --primary-text: #241503; --danger: #e0606a;
  --board: #1b2617; --backdrop: #0b1009; color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  height: 100%; margin: 0; background: var(--backdrop); color: var(--text);
  font-family: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  display: flex; align-items: center; justify-content: center; overflow: hidden;
  -webkit-tap-highlight-color: transparent; user-select: none;
}
/* the game is laid out once in a fixed 450x800 (9:16) design frame, then scaled as a whole (fitFrame sets
   --k) so every element keeps the same proportions at any window size; on a phone-shaped or narrow screen
   the frame fills the screen (450 wide, taller to match) instead */
#app {
  position: relative; display: flex; flex-direction: column; overflow: hidden; flex-shrink: 0;
  width: 450px; height: var(--fh, 800px); transform: scale(var(--k, 1)); background: var(--bg);
  border: 2px solid var(--line); border-radius: 18px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.35);
  container-type: inline-size;
}
#app.full { border: 0; border-radius: 0; box-shadow: none; }
/* the stat bar and action buttons belong to Gameplay only; Home and the Workshop get the whole frame */
#app.nogame > header, #app.nogame > footer { display: none; }
/* stat bar: fixed columns so changing numbers never push anything around. Wave on the left, the phase text in
   the middle, loot right-aligned on the right, and health or the enemy limit centred along the bottom */
header {
  display: grid; grid-template-columns: 1fr 1.3fr 1fr; gap: 2px 8px; align-items: start;
  padding: 8px 14px 6px; background: var(--surface); border-bottom: 1px solid var(--line);
  font-size: 15px; line-height: 1.2; font-variant-numeric: tabular-nums;
}
header .stat { white-space: nowrap; }
header .stat b { font-weight: 800; font-size: 18px; }
header .stat span { color: var(--muted); margin-left: 3px; }
header .hr { text-align: right; }
header .hb { grid-column: 1 / -1; display: flex; justify-content: center; gap: 14px; margin-top: 2px; }
#wave b { font-size: 20px; }
#phase { align-self: center; text-align: center; color: var(--muted); font-weight: 700; font-size: 13px; line-height: 1.15; }
/* gold and charms sit in one line right above Summon, split at its centre: gold grows leftward, charms rightward.
   Each half clips rather than wrapping, so nothing else moves */
#purse { position: relative; grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; font-size: 15px; line-height: 1.2; font-variant-numeric: tabular-nums; }
#purse .stat { position: relative; white-space: nowrap; min-width: 0; } /* not clipped, so the coin pop can show */
#purse #gold { text-align: right; }
#purse .clip { overflow: hidden; }
#purse b { font-weight: 800; font-size: 18px; }
#purse span { color: var(--muted); margin-left: 3px; }
/* end of a wave: what it earned pops up centred above the gold and charms, with a breakdown underneath, then fades */
.coinpop {
  position: absolute; left: 0; right: 0; bottom: 100%; width: max-content; max-width: 100%; margin: 0 auto 6px;
  z-index: 4; white-space: nowrap; pointer-events: none; text-align: center;
  padding: 1px 10px 2px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line);
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15); font-size: 15px; font-weight: 800; color: #b8860b;
  animation: coinpop 2.6s ease-out forwards;
}
.coinpop small { display: block; font-size: 11px; font-weight: 700; color: var(--muted); overflow: hidden; text-overflow: ellipsis; }
.coinpop i {
  display: inline-block; width: 13px; height: 13px; margin-right: 3px; vertical-align: -2px; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #fff6c8 0 18%, #ffd34d 22%); border: 1.5px solid #b8860b;
}
@keyframes coinpop { 0% { opacity: 0; transform: translateY(8px) scale(0.85); } 12% { opacity: 1; transform: none; } 80% { opacity: 1; } 100% { opacity: 0; transform: translateY(-8px); } }
@media (prefers-reduced-motion: reduce) { .coinpop { animation-name: coinfade; } }
@keyframes coinfade { 0%, 70% { opacity: 1; } 100% { opacity: 0; } }
#hp.danger b, #enemies.danger b { color: var(--danger); }
main { position: relative; flex: 1; min-height: 0; background: var(--board); }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }
/* overlay over the whole frame for effects that leave the board (new units flying out of a button) */
#zoomctl { position: absolute; left: 8px; top: 50%; transform: translateY(-50%); z-index: 3; display: flex; flex-direction: column; gap: 6px; }
#zoomctl button { width: 40px; height: 40px; min-height: 0; padding: 0; font-size: 22px; font-weight: 800; opacity: 0.85; touch-action: manipulation; }
#zoomctl #zFit { font-size: 12px; }
#fx { position: absolute; inset: 0; pointer-events: none; z-index: 4; } /* above the Gamble panel, below the Workshop */
/* the top of the board: the unit info pill, with toasts stacking under it (kept away from Summon and the burrow) */
#topstack {
  position: absolute; top: 8px; left: 50%; transform: translateX(-50%); width: min(94%, 440px); z-index: 3;
  display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none;
}
#toasts { display: flex; flex-direction: column; gap: 4px; align-items: center; width: 100%; }
.toast {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px;
  padding: 3px 12px; font-size: 14px; font-weight: 700; text-align: center;
  box-shadow: 0 2px 0 var(--line);
}
#hint {
  position: absolute; left: 0; right: 0; bottom: 6px; padding: 0 14px;
  text-align: center; font-size: 14px; color: var(--muted); pointer-events: none; min-height: 1.2em;
}
#info {
  width: 100%; pointer-events: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 7px 10px 8px; font-size: 13px; line-height: 1.3; box-shadow: 0 2px 0 var(--line);
}
#info[hidden] { display: none; }
#upg, #gam {
  position: absolute; left: 50%; bottom: 8px; transform: translateX(-50%); width: min(94%, 440px); max-height: 72%;
  overflow-y: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
  padding: 8px 10px; z-index: 4; box-shadow: 0 2px 0 var(--line); font-size: 13px; line-height: 1.3;
}
#upg[hidden], #gam[hidden] { display: none; }
#upg .uhead, #gam .uhead { display: flex; align-items: center; gap: 8px; }
#upg .uhead b, #gam .uhead b { font-size: 16px; }
#upg .uhead button, #gam .uhead button { margin-left: auto; }
#upg .urow, #gam .urow { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
#upg .txt, #gam .txt { flex: 1; min-width: 0; }
#upg small, #gam small { display: block; color: var(--muted); }
#upg .muted, #gam .muted { color: var(--muted); }
#upg button, #gam button { min-height: 34px; padding: 4px 10px; font-size: 13px; flex-shrink: 0; }
/* Upgrades and Gamble: the title centred (close × in the corner), then one button per choice with its details and
   cost under the name. Upgrades: three on the first row, two wider ones on the second; Gamble: two wide ones */
.uhead.mid { position: relative; justify-content: center; min-height: 28px; }
.uhead.mid button { position: absolute; right: 0; top: 50%; transform: translateY(-50%); min-height: 28px !important; padding: 0 9px !important; font-size: 16px !important; }
.ugrid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin-top: 6px; }
.ugrid button { grid-column: span 2; min-height: 62px !important; padding: 5px 4px !important; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; }
.ugrid button.wide { grid-column: span 3; }
.ugrid b { font-size: 14px; line-height: 1.1; }
.ugrid small { font-size: 12px; line-height: 1.15; }
.ugrid small.cost { color: var(--text); font-weight: 800; font-size: 13px; }
#gam .note { margin-top: 6px; text-align: center; color: var(--muted); }
#info .head { display: flex; align-items: baseline; gap: 6px; }
#info .name { font-weight: 800; font-size: 15px; }
#info .muted { color: var(--muted); }
/* four fixed stat cells, so the pill keeps its shape from unit to unit */
#info .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; margin-top: 5px; text-align: center; }
#info .stats div { background: var(--bg); border-radius: 8px; padding: 2px 2px 3px; overflow: hidden; }
#info .stats small { display: block; color: var(--muted); font-size: 11px; line-height: 1.1; }
#info .stats b { font-size: 14px; font-weight: 800; white-space: nowrap; }
#info .tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
#info .tags button { min-height: 26px; padding: 1px 10px; font-size: 12px; border-radius: 999px; }
#info .tags button.on { border-color: var(--primary); box-shadow: inset 0 0 0 1.5px var(--primary); }
#info .tagtext { margin-top: 5px; color: var(--muted); }
/* buttons float on the selected unit with no panel: Sell just above it, Merge (and Craft when ready) just below.
   The gap between the rows is the unit itself, and lets taps through to it */
#ubtns { position: absolute; z-index: 4; display: flex; flex-direction: column; align-items: center; white-space: nowrap; pointer-events: none; } /* above toasts */
#ubtns[hidden] { display: none; }
#ubtns .ut, #ubtns .ub { display: flex; gap: 6px; pointer-events: auto; }
#ubtns button { min-height: 34px; padding: 4px 11px; font-size: 13px; box-shadow: 0 2px 6px rgba(0, 0, 0, 0.3); }
#ubtns button:disabled { opacity: 1; color: var(--muted); } /* solid, so nothing shows through it */
/* main actions: Expand over Speed | Summon (large, square, centred) | Upgrades over Gamble; test buttons below.
   Each side column is as tall as Summon */
footer {
  display: grid; grid-template-columns: 1fr auto 1fr; gap: 8px 10px; align-items: center;
  padding: 10px 12px; background: var(--surface); border-top: 1px solid var(--line);
}
#summon { width: 192px; height: 96px; padding: 6px; border-radius: 22px; font-size: 23px; font-weight: 800; box-shadow: 0 3px 0 rgba(0, 0, 0, 0.18); }
#summon small { display: block; font-size: 15px; font-weight: 700; opacity: 0.8; }
footer .side { display: flex; flex-direction: column; gap: 6px; align-self: stretch; }
footer .side button { flex: 1; min-height: 0; padding: 4px 6px; }
/* the echo: when the first node appears, two rings ripple out of Expand a few times (until the player taps it) */
#expand { position: relative; }
#expand.echo::before, #expand.echo::after { content: ""; position: absolute; inset: -2px; border: 3px solid var(--primary); border-radius: 14px; opacity: 0; pointer-events: none; animation: echo 1.1s ease-out 5; }
#expand.echo::after { animation-delay: 0.3s; }
@keyframes echo { 0% { transform: scale(1); opacity: 0.8; } 100% { transform: scale(1.3, 1.7); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { #expand.echo::before, #expand.echo::after { animation: none; } #expand.echo { border-color: var(--primary); } }
#expand { flex: 3; } #speed { flex: 2; font-size: 13px; font-weight: 500; }
#expand small { display: block; font-size: 13px; font-weight: 700; opacity: 0.8; }
footer .small { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
button {
  font: inherit; font-weight: 700; font-size: 15px; line-height: 1.15;
  border: 1px solid var(--line); background: var(--bg); color: var(--text);
  border-radius: 12px; padding: 10px 8px; min-height: 48px; cursor: pointer;
}
button.primary { background: var(--primary); color: var(--primary-text); border-color: transparent; }
button:disabled { opacity: 0.4; cursor: default; }
button:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
footer .small button { min-height: 36px; padding: 4px 12px; font-size: 13px; font-weight: 500; }
#modal {
  position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
  background: rgba(10, 16, 8, 0.45); padding: 16px; z-index: 4; /* above the info pill and toasts */
}
#shop { position: absolute; inset: 0; background: var(--bg); overflow-y: auto; padding: 14px 14px 24px; z-index: 5; }
#shop[hidden] { display: none; }
#shop h2 { margin: 0; font-size: 26px; font-weight: 800; }
#shop h3 { margin: 18px 0 2px; font-size: 18px; font-weight: 800; }
#shop .muted { color: var(--muted); font-weight: 500; }
#shop .item { display: flex; align-items: center; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; margin-top: 6px; }
#shop .item .txt { flex: 1; min-width: 0; }
#shop .item b { font-size: 15px; }
#shop .item small { display: block; color: var(--muted); font-size: 13px; line-height: 1.25; }
#shop .item button { min-height: 38px; padding: 4px 10px; font-size: 13px; flex-shrink: 0; }
#shop .start { width: 100%; margin-top: 18px; }
/* Workshop, Research and Artifacts stack under Play, each a little smaller than it */
#menu .trio { display: flex; flex-direction: column; align-items: center; gap: 8px; }
#menu .trio button { width: 88%; min-height: 48px; font-size: 17px; }
#menu .pair { display: flex; gap: 8px; } #menu .pair button { flex: 1; }
#feedback { position: absolute; inset: 0; background: var(--bg); z-index: 8; display: flex; flex-direction: column; }
#feedback[hidden] { display: none; }
#feedback header { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 10px 12px; background: var(--surface); border-bottom: 1px solid var(--line); }
#fbBody { display: contents; } /* the iframe or the message fills the panel */
#feedback h2 { margin: 0; font-size: 20px; font-weight: 800; }
#feedback header a { color: var(--text); font-size: 13px; margin-left: auto; }
#feedback iframe { flex: 1; width: 100%; border: 0; background: #fff; }
#feedback .empty { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px; text-align: center; color: var(--muted); font-size: 16px; }
#menu {
  position: absolute; inset: 0; z-index: 7; display: flex; align-items: center; justify-content: center; padding: 20px;
  background: radial-gradient(ellipse at 50% 35%, var(--surface), var(--bg) 70%);
}
#menu[hidden] { display: none; }
#menu .inner { width: min(100%, 360px); text-align: center; display: flex; flex-direction: column; gap: 12px; }
#menu svg { width: 150px; height: auto; margin: 0 auto; overflow: visible; }
#menu h1 { margin: 0; font-size: 40px; font-weight: 800; line-height: 1; letter-spacing: -0.5px; }
#menu p { margin: 0; color: var(--muted); font-size: 16px; }
#menu .meta { font-size: 14px; color: var(--muted); }
#menu .meta b { color: var(--text); }
#menu button { min-height: 56px; font-size: 19px; font-weight: 800; border-radius: 16px; }
#menu button.secondary { min-height: 48px; font-size: 16px; font-weight: 700; }
@keyframes crawl { 0%, 100% { transform: translateY(0) scaleX(1); } 50% { transform: translateY(-3px) scaleX(1.04); } }
#menu .seg { animation: crawl 0.9s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
#menu .seg:nth-child(2) { animation-delay: -0.3s; } #menu .seg:nth-child(3) { animation-delay: -0.6s; }
@media (prefers-reduced-motion: reduce) { #menu .seg { animation: none; } }
#modal.open { display: flex; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  padding: 20px; width: min(100%, 380px); text-align: center;
}
.card h2 { margin: 0 0 6px; font-size: 28px; font-weight: 800; }
.card p { margin: 0 0 16px; color: var(--muted); font-size: 16px; white-space: pre-line; }
.card .actions { display: flex; gap: 10px; }
.card .actions button { flex: 1; }
.card .actions.stack { flex-direction: column; }
.card .actions small { display: block; font-weight: 500; font-size: 13px; opacity: 0.8; margin-top: 2px; }
</style>
</head>
<body>
<div id="app">
<header>
  <div class="hl"><div class="stat" id="wave"><b>Wave 1</b></div></div>
  <div id="phase">Between waves</div>
  <div class="hr"><div class="stat" id="loot"><b>0</b><span>loot</span></div></div>
  <div class="hb">
    <div class="stat" id="hp"><b>20</b><span>/ 20 HP</span></div>
    <div class="stat" id="enemies"><b>0</b><span>enemies</span></div>
  </div>
</header>
<main>
  <canvas id="c" aria-label="Game board"></canvas>
  <div id="topstack">
    <div id="info" hidden></div>
    <div id="toasts" aria-live="polite"></div>
  </div>
  <div id="zoomctl">
    <button id="zIn" aria-label="Zoom in" title="Zoom in (or scroll, or pinch)">+</button>
    <button id="zOut" aria-label="Zoom out" title="Zoom out">−</button>
    <button id="zFit" aria-label="Fit the whole board" title="Fit the whole board">Fit</button>
  </div>
  <div id="ubtns" hidden></div>
  <div id="hint"></div>
  <div id="upg" hidden></div>
  <div id="gam" hidden></div>
  <div id="shop" hidden></div>
  <div id="feedback" hidden>
    <header><h2>Feedback</h2><a id="fbLink" href="#" target="_blank" rel="noopener" hidden>Open in new tab</a><button id="fbClose">Close</button></header>
    <div id="fbBody"></div>
  </div>
  <div id="menu" hidden></div>
  <div id="modal" role="dialog" aria-modal="true">
    <div class="card">
      <h2 id="mTitle"></h2>
      <p id="mBody"></p>
      <div class="actions" id="mActions"></div>
    </div>
  </div>
</main>
<footer>
  <div id="purse">
    <div class="stat" id="gold"><div class="clip" id="goldv"><b>70</b><span>gold</span></div></div>
    <div class="stat" id="charms"><div class="clip" id="charmsv"><b>0</b><span>✦ charms</span></div></div>
  </div>
  <div class="side">
    <button id="expand">Expand</button>
    <button id="speed">Speed 1×</button>
  </div>
  <button class="primary" id="summon">Summon</button>
  <div class="side">
    <button id="upgBtn">Upgrades</button>
    <button id="gamBtn">Gamble</button>
  </div>
  <div class="small">
    <button id="soundBtn">Sound: on</button>
    <button id="fbBtn">Feedback</button>
    <button id="quitBtn">Quit</button>
  </div>
</footer>
<canvas id="fx" aria-hidden="true"></canvas>
</div>

<script>
(() => {
"use strict";

// ---------------------------------------------------------------- config
const CFG = {
  startFieldWidth: 3, startFieldHeight: 5,
  startGold: 70, summonBaseCost: 10, summonCostStep: 1, goldPerKill: 2, waveClearBonus: 10,
  interestRate: 0.05, // gold held at wave end earns 5% interest, no cap
  bankInterestBonus: 0.02, // each Bank adds 2 percentage points
  startHp: 20,
  // Two modes, picked on the start menu.
  // Classic: the player starts each wave; laps cost health.
  // Timed: waves arrive on a timer and only a boss pauses the game; an enemy limit replaces health.
  waveDuration: 20, // game seconds from one wave's start to the next
  prepTime: 8,      // game seconds before wave 1 arrives
  // ENEMY LIMIT instead of health: going over the limit starts a countdown; still over when it ends, you lose.
  enemyCap: 60,       // enemies allowed on the board
  overCapTime: 12,    // game seconds you can stay over the limit
  bossCapWeight: 1,   // a boss counts as this many enemies toward the limit (her timer is the real threat)
  baseSpeed: 2, // game pace at 1×; the speed button multiplies this
  hpGrowthPerWave: 0.15, // every enemy's HP grows this much per wave
  // A wave is a list of entries: which unit, how many, and the delay (s) between each spawn.
  baseWave: [{ unit: "Grub", count: 20, delay: 0.5 }],
  bossEntry: { unit: "GrubMother", count: 1, delay: 0.5 },
  // node rewards: a bigger enemy limit, more enemies every wave for more gold and loot, or more damage
  nodeCapBonus: 10,
  nodeEnemyReward: { unit: "Grub", count: 5, delay: 0.5 }, nodeEnemyLoot: 1, // loot per wave for each pick
  nodeDamageBonus: 0.1, // the + damage reward adds this much damage for every unit, for the rest of the run
  resumePrep: 5, // game seconds of countdown after continuing a saved run, before its wave starts
  bossBreak: 5, // timed: game seconds of calm after a boss wave before the next wave starts (a flat 5s, however long the boss took)
  bossTime: 90, // timed: game seconds to kill the Grub Mother once she's out, or the run is lost
  bossEvery: 10, bossSpawnInterval: 5, bossSpawnCount: 0,
  bossGold: 20,
  feedbackUrl: "https://docs.google.com/forms/d/e/1FAIpQLSd_GbqIb8YMl_hx6PoSkhBVsQKMqBHNNhmiYOW-tPRQHaU2ww/viewform", // a Google Form link for the Feedback button (empty: the button shows a "not set up" note)
  expandBaseCost: 30, expandCostStep: 10,
  firstNodeAfterWave: 3, nodeEvery: 3, nodeDistance: 3, // nodes spawn this many expands away, straight out from the field
  lootPerWave: 1, lootPerBoss: 10, deathKeepFraction: 0.3,
    buildingRefundGold: 30, // paid instead of a building when the board has no free tile
  sellValue: 5, sellMult: 3, // gold back per unit sold: Tier 1 pays sellValue, each tier above pays sellMult times the one below
  tierScale: 3.5, // each tier multiplies a unit's damage by this; tiers have no cap
};

// ---------------------------------------------------------------- units
// Every unit uses one template. attack.kind "projectile" flies to its target; "cone" is a stationary wedge; "melee" strikes
// the one furthest enemy in reach; "pulse" strikes every enemy in reach at once.
