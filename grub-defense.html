// ---------------------------------------------------------------- board
class Board {
  constructor(w, h) {
    this.field = new Set(); this.nodes = new Map();
    for (let x = 0; x < w; x++) for (let y = 0; y < h; y++) this.field.add(K(x, y));
    this.rebuild();
  }
  has(x, y) { return this.field.has(K(x, y)); }
  // Tiles away from the field, counting diagonals. 1 = path tile.
  dist(x, y) {
    let d = Infinity;
    for (const k of this.field) {
      const [fx, fy] = P(k), c = Math.max(Math.abs(fx - x), Math.abs(fy - y));
      if (c < d) { d = c; if (d === 0) break; }
    }
    return d;
  }
  ring(r) {
    const { minX, minY, maxX, maxY } = this.bounds(), out = [];
    for (let x = minX - r; x <= maxX + r; x++)
      for (let y = minY - r; y <= maxY + r; y++)
        if (this.dist(x, y) === r) out.push([x, y]);
    return out;
  }
  isExpandable(x, y) {
    if (this.has(x, y)) return false;
    return DIRS.some(([dx, dy]) => this.has(x + dx, y + dy));
  }
  expandable() {
    const s = new Set();
    for (const k of this.field) {
      const [x, y] = P(k);
      for (const [dx, dy] of DIRS) if (!this.has(x + dx, y + dy)) s.add(K(x + dx, y + dy));
    }
    return [...s].map(P);
  }
  bounds() {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (const k of this.field) {
      const [x, y] = P(k);
      minX = Math.min(minX, x); minY = Math.min(minY, y); maxX = Math.max(maxX, x); maxY = Math.max(maxY, y);
    }
    return { minX, minY, maxX, maxY };
  }
  expand(x, y) {
    const res = { claimed: null, engulfed: [], filled: [] };
    const k = K(x, y);
    this.field.add(k);
    if (this.nodes.has(k)) { res.claimed = this.nodes.get(k); this.nodes.delete(k); }
    this.fillEnclosed(res);
    this.rebuild();
    return res;
  }
  fillEnclosed(res) {
    let { minX, minY, maxX, maxY } = this.bounds();
    minX--; minY--; maxX++; maxY++;
    const outside = new Set([K(minX, minY)]), q = [[minX, minY]];
    while (q.length) {
      const [cx, cy] = q.pop();
      for (const [dx, dy] of DIRS) {
        const nx = cx + dx, ny = cy + dy, nk = K(nx, ny);
        if (nx < minX || nx > maxX || ny < minY || ny > maxY) continue;
        if (this.field.has(nk) || outside.has(nk)) continue;
        outside.add(nk); q.push([nx, ny]);
      }
    }
    for (let x = minX; x <= maxX; x++) for (let y = minY; y <= maxY; y++) {
      const k = K(x, y);
      if (this.field.has(k) || outside.has(k)) continue;
      this.field.add(k); res.filled.push([x, y]);
      if (this.nodes.has(k)) { res.engulfed.push(this.nodes.get(k)); this.nodes.delete(k); }
    }
  }
  rebuild() {
    const next = new Map();
    for (const k of this.field) {
      const [x, y] = P(k);
      if (!this.has(x, y - 1)) next.set(K(x, y), K(x + 1, y));
      if (!this.has(x + 1, y)) next.set(K(x + 1, y), K(x + 1, y + 1));
      if (!this.has(x, y + 1)) next.set(K(x + 1, y + 1), K(x, y + 1));
      if (!this.has(x - 1, y)) next.set(K(x, y + 1), K(x, y));
    }
    let start = null;
    for (const k of next.keys()) {
      const [x, y] = P(k);
      if (!start || y < start[1] || (y === start[1] && x < start[0])) start = [x, y];
    }
    const corners = []; let cur = K(start[0], start[1]); const sk = cur; let guard = next.size + 2;
    do { corners.push(P(cur)); cur = next.get(cur); } while (cur && cur !== sk && --guard > 0);

    const n = corners.length; let kept = [];
    for (let i = 0; i < n; i++) {
      const p = corners[(i - 1 + n) % n], c = corners[i], q = corners[(i + 1) % n];
      if (sgn(c[0] - p[0]) !== sgn(q[0] - c[0]) || sgn(c[1] - p[1]) !== sgn(q[1] - c[1])) kept.push(c);
    }
    if (kept.length < 3) kept = corners;
    const m = kept.length, pts = [];
    for (let i = 0; i < m; i++) {
      const p = kept[(i - 1 + m) % m], c = kept[i], q = kept[(i + 1) % m];
      const di = [sgn(c[0] - p[0]), sgn(c[1] - p[1])], dout = [sgn(q[0] - c[0]), sgn(q[1] - c[1])];
      pts.push([c[0] + 0.5 * (di[1] + dout[1]), c[1] + 0.5 * (-di[0] - dout[0])]);
    }
    this.path = new LoopPath(pts);
  }
  // Restart the loop at the point closest to `pos`, so the burrow (path distance 0) stays put when the path is
  // rebuilt. If the burrow's spot was built over, it shifts to the nearest point of the new path (about 1 tile).
  rebase(pos) {
    const path = this.path, pts = path.points, n = pts.length, d = path.closest(pos);
    let i = 0;
    while (i < n - 1 && path.cum[i + 1] <= d) i++;
    const start = path.at(d), out = [start];
    for (let j = 1; j <= n; j++) {
      const p = pts[(i + j) % n];
      if (Math.hypot(p[0] - out[out.length - 1][0], p[1] - out[out.length - 1][1]) > 1e-6) out.push(p);
    }
    if (Math.hypot(out[out.length - 1][0] - start[0], out[out.length - 1][1] - start[1]) < 1e-6) out.pop();
    this.path = new LoopPath(out);
  }
}

// ---------------------------------------------------------------- state
let S;
function newGame() {
  S = {
    board: new Board(CFG.startFieldWidth, CFG.startFieldHeight),
    phase: "build", wave: 1,
    spawned: 0, spawnTimer: 0, graceTimer: 0, bossTimer: 0, bossSpawned: false, boss: null,
    spawnList: [], pendingEntries: [], clock: 0,
    hp: CFG.startHp, maxHp: CFG.startHp, hits: [],
    gold: CFG.startGold + 10 * rl("StartGold"), summonCount: 0, expandCount: 0, expandMode: false, loot: 0, finalLoot: 0,
    nextPackId: 0, packs: new Map(), pendingRewards: 0, waveExtras: [], enemyCap: CFG.enemyCap + 5 * rl("EnemyCap"), bossTime: CFG.bossTime, bossLeft: null, lootBonus: 0, damageBonus: 0, heldBuildings: [], upgrades: {}, charms: 0, pity: {},
    enemies: [], towers: new Map(), selected: null,
    drag: null, speed: 1, toasts: [], flashes: [], projectiles: [], coins: [], corpses: [], zones: [], planks: [], pings: [], flyers: [],
    cashedOut: false, endReason: "", nodeHint: false,
  };
  S.burrow = S.board.path.at(0); // where enemies come out; it stays here as the board grows
  for (let i = 0; i < al("HeadStart"); i++) addUnit(rollFrom(BASE_UNITS));
  S.mode = META.mode === "classic" ? "classic" : "timed";
  if (S.mode === "timed") { // the run is live from the start; wave 1 arrives after a short countdown
    S.phase = "combat"; S.prep = S.prepFull = CFG.prepTime + 3 * rl("Scouts"); S.waveTime = 0; S.waveLive = false; // the burrow counts it down
  } else toast("Summon towers, then start the wave.");
  closeModal(); closeShop(); resetView();
}
const isBossWave = w => CFG.bossEvery > 0 && w % CFG.bossEvery === 0;
// timed mode uses the enemy limit instead of health
const limitMode = () => S && S.mode === "timed";
// how full the board is against the enemy limit (a boss counts as several)
const boardLoad = () => S.enemies.reduce((n, e) => n + (e.hp > 0 ? (e.isBoss ? CFG.bossCapWeight : 1) : 0), 0);
// A wave's spawn list (the coming wave by default): base entries, then node entries, then the boss last.
const nextWaveList = (w = S.wave) => [
  ...CFG.baseWave.map(e => ({ ...e })),
  ...S.waveExtras.map(e => ({ ...e })),
  ...S.pendingEntries.map(e => ({ ...e })),
  ...(isBossWave(w) ? [{ ...CFG.bossEntry }] : []),
];
// Timed: the countdown the burrow shows. While the Grub Mother is out, the time left to kill her (boss: true);
// otherwise the seconds until the next wave, once the current one has finished coming out (or before wave 1).
// null while enemies are still spawning, or on a boss wave before she's out.
function nextWaveIn() {
  if (S.mode !== "timed" || S.phase !== "combat") return null;
  if (S.boss && S.bossLeft != null) return { left: S.bossLeft, full: S.bossTime, boss: true };
  if (S.spawnList.length) return null;
  if (!S.waveLive) return { left: S.prep, full: S.prepFull };
  return isBossWave(S.wave) ? null : { left: Math.max(0, CFG.waveDuration - S.waveTime), full: CFG.waveDuration };
}
const countOf = list => list.reduce((n, e) => n + (e.left ?? e.count), 0);
const remainingToSpawn = () => S.phase === "combat" ? countOf(S.spawnList) : countOf(nextWaveList());
const describeList = list => {
  const totals = {};
  for (const e of list) totals[e.unit] = (totals[e.unit] || 0) + (e.left ?? e.count);
  return Object.entries(totals).map(([u, n]) => `${n} ${ENEMIES[u].label}`).join(" + ");
};
const summonCost = () => CFG.summonBaseCost + CFG.summonCostStep * S.summonCount;
const expandCost = () => CFG.expandBaseCost + CFG.expandCostStep * S.expandCount;

function toast(text) {
  S.toasts.push({ text, ttl: 3 });
  if (S.toasts.length > 3) S.toasts.shift();
}

// ---------------------------------------------------------------- enemies
function spawnEnemy(hp, speed, dist, size, kind, isBoss, packId) {
  const e = { hp, maxHp: hp, speed, dist, traveled: 0, laps: 0, size, kind, isBoss, packId, spawnTimer: CFG.bossSpawnInterval };
  e.pos = S.board.path.at(dist);
  S.enemies.push(e);
  return e;
}
function spawnUnit(name, dist, packId) {
  const u = ENEMIES[name];
  const e = spawnEnemy(enemyHp(name, S.wave) * enemyMods().hp, u.speed, dist, u.size, name, !!u.boss, packId);
  if (u.boss) {
    S.boss = e; S.bossSpawned = true; sfx("bossSpawn");
    if (limitMode()) { S.bossLeft = S.bossTime; toast(`The ${u.label} emerges! Defeat her within ${S.bossTime}s.`); }
    else toast(`The ${u.label} emerges!`);
  }
  return e;
}

// A lap is completed every time an enemy walks past the burrow. Being flung over it by a flip doesn't count,
// being flipped back behind it doesn't undo a lap, and walking past it again counts again.
// Each completed lap hurts more: lap 1 deals 0, lap 2 deals 1, lap 3 deals 2...
function lapCheck(e, L) {
  const idx = Math.floor(e.dist / L);
  if (e.lapIdx === undefined) e.lapIdx = idx;
  while (idx > e.lapIdx) {
    e.lapIdx++; e.laps++;
    const dmg = (e.laps - 1) * (ENEMIES[e.kind].damageMult || 1);
    if (dmg > 0 && !limitMode()) { S.hp -= dmg; S.hits.push({ text: `-${dmg}`, pos: e.pos.slice(), ttl: 1 }); } // no lap damage with an enemy limit
  }
  if (idx < e.lapIdx) e.lapIdx = idx;
}

function moveEnemies(dt) {
  const mods = enemyMods();
  const path = S.board.path, extra = [];
  for (const e of S.enemies) {
    if (e.flight) { // flipped by Walk the Plank: flying across the board, not walking
      const f = e.flight; f.t += dt;
      const p = Math.min(1, f.t / f.dur);
      e.pos = [f.from[0] + (f.to[0] - f.from[0]) * p, f.from[1] + (f.to[1] - f.from[1]) * p];
      // landing: being flung over the burrow doesn't count as a lap; only walking past it does
      if (p >= 1) { e.flight = null; e.pos = path.at(e.dist); e.lapIdx = Math.floor(e.dist / path.length); }
      continue;
    }
    if (e.burnUntil && S.clock < e.burnUntil) hurt(e, e.burnDps * dt);
    if (mods.regen && e.hp > 0) e.hp = Math.min(e.maxHp, e.hp + e.maxHp * mods.regen * dt); // Regeneration nodes
    const slowed = e.slowUntil && S.clock < e.slowUntil;
    const held = e.holdUntil && S.clock < e.holdUntil; // stunned or entangled: can't move
    const step = held ? 0 : e.speed * mods.speed * (slowed ? 1 - e.slowAmt : 1) * dt; // node boosts speed them up
    const prev = e.pos;
    e.dist += step; e.traveled += step; e.pos = path.at(e.dist);
    if (step > 0) { e.dir = Math.atan2(e.pos[1] - prev[1], e.pos[0] - prev[0]); e.walk = (e.walk || 0) + step * 7; }
    lapCheck(e, path.length);
    if (e.isBoss && e.hp > 0) {
      e.spawnTimer -= dt;
      if (e.spawnTimer <= 0) {
        e.spawnTimer += CFG.bossSpawnInterval;
        for (let i = 0; i < CFG.bossSpawnCount; i++) extra.push(e.dist - 0.45 * (i + 1));
      }
    }
  }
  for (const d of extra) spawnUnit("Grub", d, -1);
}

function cleanupDead() {
  for (let i = S.enemies.length - 1; i >= 0; i--) {
    const e = S.enemies[i];
    if (e.hp > 0) continue;
    let bounty = e.isBoss ? CFG.bossGold : CFG.goldPerKill;
    if (!e.isBoss && al("GildedShovel")) { // fractional bonus gold carries over between kills
      S.goldFrac = (S.goldFrac || 0) + CFG.goldPerKill * 0.1 * al("GildedShovel");
      const extra = Math.floor(S.goldFrac); S.goldFrac -= extra; bounty += extra;
    }
    S.gold += bounty; sfx(e.isBoss ? "bossDown" : "kill");
    dropCoins(bounty, e.pos);
    // killed by a unit with itemChance (the Bandit): maybe drop an item (placeholder until items exist)
    const killer = e.killedBy && UNITS[e.killedBy];
    if (killer && killer.attack.itemChance && Math.random() < killer.attack.itemChance) dropItem(e.pos);
    if (e.isBoss) { S.loot += CFG.lootPerBoss; S.charms += CHARMS.boss; toast(`Grub Mother defeated! +${CFG.lootPerBoss} loot, +${CHARMS.boss} ✦`); S.boss = null; S.bossLeft = null; }
    // death animation: the body puffs up, bursts into bits and fades
    S.corpses.push({ x: e.pos[0], y: e.pos[1], r: e.size / 2, kind: e.kind, dir: e.dir || 0, ttl: 0.45, max: 0.45 });
    S.enemies.splice(i, 1);
  }
}

// ---------------------------------------------------------------- towers
function towersAttack(dt) {
  for (const t of S.towers.values()) {
    if (t.building) continue;
    pulseAura(t, dt);
    const def = UNITS[t.type], s = boosted(t), o = center(t.x, t.y), r2 = s.range * s.range;
    let near = null; // enemies in reach, worked out only when a unit is ready
    const targets = () => (near = (near || S.enemies.filter(e => (e.pos[0] - o[0]) ** 2 + (e.pos[1] - o[1]) ** 2 <= r2))
      .filter(e => e.hp > 0).sort((a, b) => b.traveled - a.traveled)); // every unit targets the furthest enemy along the path
    if (def.plank) usePlank(t, def.plank, o, dt);
    if (def.spin) useSpin(t, def.spin, s, o, dt);
    if (S.clock < (t.busyUntil || 0)) continue; // busy laying or pulling a plank, or stunned: no attacks at all
    // every unit in the stack has its own attack timer; new units start out of step with the rest
    t.cds = t.cds || [];
    while (t.cds.length < t.count) t.cds.push(Math.random() / s.aps);
    // ramp (Berserker): each attack in an unbroken run is faster; a pause resets it
    if (def.ramp && S.clock - (t.lastAtk ?? -1e9) > def.ramp.reset) t.rampN = 0;
    // rapid fire (Archer, Tier 2): when ready and an enemy is in reach, shoots faster for a short time
    const rp = s.rapid;
    if (rp && S.clock >= (t.rapidUntil || 0)) {
      t.rapidCd = (t.rapidCd ?? rp.every * 0.5) - dt;
      if (t.rapidCd <= 0 && targets().length) {
        t.rapidUntil = S.clock + rp.duration; t.rapidCd = rp.every;
        t.cds = t.cds.map(c => Math.min(c, 1 / (s.aps * rp.mult))); // the next shots come at the fast rate
        S.flashes.push({ kind: "blast", o: o.slice(), range: 0.6, color: UNITS[t.type].color, ttl: 0.3, max: 0.3 });
      }
    }
    const aps = s.aps * (def.ramp ? 1 + Math.min(def.ramp.max, def.ramp.per * (t.rampN || 0)) : 1) * (rp && S.clock < (t.rapidUntil || 0) ? rp.mult : 1);
    for (let u = 0; u < t.count; u++) {
      t.cds[u] -= dt;
      if (t.cds[u] > 0) continue;
      const list = targets();
      if (!list.length) { t.cds[u] = 0; continue; }
      t.aim = Math.atan2(list[0].pos[1] - o[1], list[0].pos[0] - o[0]);
      ATTACKS[s.attack.kind](t, s, o, list, u); sfx("shot_" + s.attack.kind);
      t.atkT = 1; t.lastAtk = S.clock; t.rampN = (t.rampN || 0) + 1;
      t.cds[u] = 1 / aps;
    }
    if (def.skill) useSkill(t, def.skill, s, o, targets, dt);
    if (def.secondary) useSecondary(t, def.secondary, s, o, dt);
  }
}

// Secondary attacks (the Pirate's pistol): a second weapon with its own damage, range and timer per unit.
// It gets the same boosts (War Drum, training, artifacts) as the main attack.
function useSecondary(t, sec, s, o, dt) {
  const ss = { ...sec, damage: sec.damage * (s.damage / stats(t).damage) }, r2 = sec.range * sec.range;
  t.secCds = t.secCds || [];
  while (t.secCds.length < t.count) t.secCds.push((0.3 + Math.random() * 0.7) / sec.aps);
  for (let u = 0; u < t.count; u++) {
    t.secCds[u] -= dt;
    if (t.secCds[u] > 0) continue;
    const list = S.enemies.filter(e => e.hp > 0 && (e.pos[0] - o[0]) ** 2 + (e.pos[1] - o[1]) ** 2 <= r2)
      .sort((a, b) => b.traveled - a.traveled);
    if (!list.length) { t.secCds[u] = 0; continue; }
    t.aim = Math.atan2(list[0].pos[1] - o[1], list[0].pos[0] - o[0]);
    ATTACKS[sec.attack.kind](t, ss, o, list, u);
    t.atkT = 1; t.secCds[u] = 1 / sec.aps;
    act(t, sec.act, list[0].pos);
  }
}

// Skills (the Knight's shield bash): each unit in the stack uses its own on a timer.
function useSkill(t, sk, s, o, targets, dt) {
  t.skCds = t.skCds || [];
  while (t.skCds.length < t.count) t.skCds.push(sk.every * (0.5 + Math.random() * 0.5));
  for (let u = 0; u < t.count; u++) {
    t.skCds[u] -= dt;
    if (t.skCds[u] > 0) continue;
    const list = targets();
    if (!list.length) { t.skCds[u] = 0; continue; }
    const e = list[0];
    hurt(e, s.damage * sk.damageMult, t.type);
    applyHold(e, sk.stun, "stun");
    S.flashes.push({ kind: "blast", o: e.pos.slice(), range: 0.45, color: "#ffe066", ttl: 0.25, max: 0.25 });
    t.atkT = 1; t.skCds[u] = sk.every;
    act(t, sk.act, e.pos);
  }
}

// Stuns and roots stop an enemy in place. Bosses shrug off half the duration.
function applyHold(e, dur, kind) {
  const d = dur * (e.isBoss ? 0.5 : 1), active = e.holdUntil && S.clock < e.holdUntil;
  e.holdUntil = Math.max(active ? e.holdUntil : 0, S.clock + d);
  e.holdKind = kind;
}

// ---------------------------------------------------------------- Walk the Plank (Gangplank)
// Lays a plank on the path just ahead of the furthest enemy in range. The first non-boss enemy to step on it
// is flipped straight across the board. If that line meets the path in more than one place, it picks the
// landing spot that sets the enemy furthest back along its lap.
// Lays a plank on a path tile straight next to the Gangplank (so it has to sit on the field's edge). The plank stays until
// an enemy steps on it; a new one is laid 8s after that. If two path tiles touch the unit (a corner), it picks the one
// further along the enemies' route.
// ---------------------------------------------------------------- unit actions (generic)
// act() plays an ability's animation and, if it has busy time, stops the unit attacking for that long.
function act(t, cfg, at, extra) {
  if (!cfg) return;
  if (cfg.busy) t.busyUntil = Math.max(t.busyUntil || 0, S.clock + cfg.busy);
  if (cfg.anim) t.anim = { kind: cfg.anim, start: S.clock, end: S.clock + (cfg.animTime || cfg.busy || 0.3),
                           at: at || center(t.x, t.y), prop: cfg.prop, ...extra };
}
// stun any unit: it reels dizzy and does nothing for the duration
function stunUnit(t, secs) { if (secs > 0) act(t, { anim: "dizzy", busy: secs }); }

// Spin (Flame Spinner): on a timer, spins for a while hitting every enemy within the radius each tick.
// The unit is busy (no other attacks) for the whole spin. Damage gets the same boosts as its main attack.
function useSpin(t, sp, s, o, dt) {
  if (t.spinUntil && S.clock < t.spinUntil) {
    t.spinTick = (t.spinTick || 0) - dt;
    if (t.spinTick > 0) return;
    t.spinTick = sp.tick;
    const dmg = sp.damage * (s.damage / stats(t).damage), r2 = sp.radius * sp.radius;
    for (const e of S.enemies)
      if (e.hp > 0 && (e.pos[0] - o[0]) ** 2 + (e.pos[1] - o[1]) ** 2 <= r2) { hurt(e, dmg, t.type); if (sp.burn) applyBurn(e, sp.burn); }
    return;
  }
  if (S.clock < (t.busyUntil || 0)) return; // stunned or busy with something else
  t.spinCd = (t.spinCd ?? sp.every * 0.5) - dt;
  if (t.spinCd > 0) return;
  const r2 = sp.radius * sp.radius;
  if (!S.enemies.some(e => e.hp > 0 && (e.pos[0] - o[0]) ** 2 + (e.pos[1] - o[1]) ** 2 <= r2)) { t.spinCd = 0; return; }
  t.spinUntil = S.clock + sp.duration; t.spinTick = 0; t.spinCd = sp.every;
  act(t, { anim: sp.anim || "spin", busy: sp.duration }, o, { radius: sp.radius });
}

// Animations: given progress p (0-1) and the screen vector toward the action's target, how far to offset the unit.
// carry also says where its prop is; dizzy adds stars.
const ANIMS = {
  lunge:  (p, vx, vy) => { const k = Math.sin(Math.PI * p) * 0.35; return { mx: vx * k, my: vy * k }; },
  yank:   (p, vx, vy) => { const k = Math.sin(Math.PI * Math.min(1, p * 2)) * 0.22; return { mx: vx * k, my: vy * k }; },
  recoil: (p, vx, vy) => { const k = -Math.sin(Math.PI * p) * 0.12; return { mx: vx * k, my: vy * k }; },
  carry:  (p, vx, vy) => { const k = Math.sin(Math.PI * p) * 0.5; // walks out, sets the prop down halfway, walks back
                           return { mx: vx * k, my: vy * k, propAt: p < 0.5 ? [vx * (k + 0.18), vy * (k + 0.18)] : [vx, vy] }; },
  jump:   (p, vx, vy, s) => ({ mx: 0, my: -Math.sin(Math.PI * p) * s * 0.35 }),
  dizzy:  (p, vx, vy, s) => ({ mx: Math.sin(time * 40) * s * 0.04, my: 0, stars: true }),
  spin:   (p) => ({ mx: 0, my: 0, rot: p * Math.PI * 2 * 6, flames: true }), // whirls round with a ring of fire
};
const PROPS = {
  plank(x, y, ang, s) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(-(ang || 0) + Math.PI / 2);
    ctx.fillStyle = "#8a5a2b"; ctx.strokeStyle = "#4f3214"; ctx.lineWidth = 2;
    ctx.fillRect(-s * 0.3, -s * 0.08, s * 0.6, s * 0.16); ctx.strokeRect(-s * 0.3, -s * 0.08, s * 0.6, s * 0.16);
    ctx.restore();
  },
};

// ---------------------------------------------------------------- Walk the Plank (uses the plank settings on the unit)
function usePlank(t, pk, o, dt) {
  if (t.laying) { // the plank goes down when laying finishes (cancelled if the unit was moved meanwhile)
    if (S.clock >= t.laying.done) {
      if (K(t.x, t.y) === t.laying.key) S.planks.push({ ...t.laying.plank, owner: t, key: t.laying.key });
      t.laying = null;
    }
    return;
  }
  if (S.clock < (t.busyUntil || 0)) return; // still pulling or stunned
  t.plankCd = (t.plankCd ?? pk.every * 0.5) - dt;
  if (t.plankCd > 0 || S.planks.some(p => p.owner === t)) return;
  const path = S.board.path, L = path.length, spots = [];
  for (const [dx, dy] of DIRS) { // straight neighbours only, not diagonals
    const x = t.x + dx, y = t.y + dy;
    if (!S.board.has(x, y) && S.board.dist(x, y) === 1) spots.push(path.closest([x + 0.5, y + 0.5]));
  }
  if (!spots.length) return; // not next to the path
  // with two choices (a corner), take the one further along the enemies' route
  const furtherAlong = (a, b) => ((a - b) % L + L) % L < L / 2;
  const d = spots.reduce((best, x) => furtherAlong(x, best) ? x : best), pos = path.at(d), ahead = path.at(d + 0.05);
  const plank = { pos, ang: Math.atan2(ahead[1] - pos[1], ahead[0] - pos[0]) }, lay = pk.lay || {};
  t.laying = { plank, done: S.clock + (lay.busy || 0), key: K(t.x, t.y) };
  act(t, lay, pos, { ang: plank.ang });
}

function tickPlanks() {
  for (let i = S.planks.length - 1; i >= 0; i--) {
    const p = S.planks[i];
    // the plank goes if its Gangplank is moved, sold or merged
    if (S.towers.get(p.key) !== p.owner || K(p.owner.x, p.owner.y) !== p.key) { S.planks.splice(i, 1); continue; }
    const e = S.enemies.find(e => e.hp > 0 && !e.flight && (e.pos[0] - p.pos[0]) ** 2 + (e.pos[1] - p.pos[1]) ** 2 <= 0.35 * 0.35);
    if (!e) continue;
    S.planks.splice(i, 1);
    const g = p.owner, pk = UNITS[g.type].plank;
    g.plankCd = pk.every;
    if (e.isBoss) { // too heavy to flip: the plank snaps, the boss walks on, the unit is stunned
      stunUnit(g, (pk.heavy && pk.heavy.stun) || 0);
      S.flashes.push({ kind: "blast", o: p.pos.slice(), range: 0.5, color: "#8a5a2b", ttl: 0.3, max: 0.3 });
    } else {
      flipAcross(e, p);
      act(g, pk.pull, p.pos);
    }
  }
}

// where a ray from o in direction d crosses segment a-b, if it does
function raySeg(o, d, a, b) {
  const ex = b[0] - a[0], ey = b[1] - a[1], den = d[0] * ey - d[1] * ex;
  if (Math.abs(den) < 1e-9) return null;
  const t = ((a[0] - o[0]) * ey - (a[1] - o[1]) * ex) / den, u = ((a[0] - o[0]) * d[1] - (a[1] - o[1]) * d[0]) / den;
  return t < 0 || u < 0 || u > 1 ? null : { t, point: [o[0] + d[0] * t, o[1] + d[1] * t] };
}

function flipAcross(e, p) {
  const path = S.board.path, pts = path.points, L = path.length;
  // The enemy is flung over the Gangplank: along the line from the plank through the Gangplank's tile.
  let nx, ny, past = 0.6;
  const g = p.owner;
  if (g) {
    const gc = center(g.x, g.y), dx = gc[0] - p.pos[0], dy = gc[1] - p.pos[1], d = Math.hypot(dx, dy) || 1;
    nx = dx / d; ny = dy / d; past = d;
  } else { // no owner (shouldn't happen): straight into the field
    nx = -Math.sin(p.ang); ny = Math.cos(p.ang);
    const b = S.board.bounds(), cx = (b.minX + b.maxX + 1) / 2, cy = (b.minY + b.maxY + 1) / 2;
    if (nx * (cx - p.pos[0]) + ny * (cy - p.pos[1]) < 0) { nx = -nx; ny = -ny; }
  }
  // It lands on the first stretch of path that line reaches beyond the Gangplank.
  let best = null, bestT = Infinity;
  for (let i = 0; i < pts.length; i++) {
    const hit = raySeg(p.pos, [nx, ny], pts[i], pts[(i + 1) % pts.length]);
    if (!hit || hit.t <= past || hit.t >= bestT) continue;
    bestT = hit.t; best = path.closest(hit.point);
  }
  if (best === null) return;
  // Progress changes by however far round the loop that is (the shorter way), so a forward flip can skip ahead.
  const back = ((e.dist - best) % L + L) % L, fwd = ((best - e.dist) % L + L) % L, bestMove = fwd < back ? fwd : -back;
  const from = e.pos.slice();
  // It doesn't teleport: it flies across (see moveEnemies).
  e.dist += bestMove; e.traveled += bestMove;
  e.flight = { from, to: path.at(e.dist), t: 0, dur: 0.8 };
}

// Between waves (and behind any menu) the world keeps ticking: shots in the air finish their flight, fire patches
// burn out, and every unit's ability animation plays to its end, so towers settle back into their idle bob.
// Nothing new is fired and no enemies move.
function tickIdle(dt) {
  S.clock += dt;
  updateProjectiles(dt);
  tickZones(dt);
}

// Fire patches (Pyromancer) burn everything standing in them.
function tickZones(dt) {
  for (let i = S.zones.length - 1; i >= 0; i--) {
    const z = S.zones[i];
    if (S.clock >= z.until) { S.zones.splice(i, 1); continue; }
    for (const e of S.enemies)
      if (e.hp > 0 && (e.pos[0] - z.pos[0]) ** 2 + (e.pos[1] - z.pos[1]) ** 2 <= z.r * z.r) hurt(e, z.dps * dt, z.src);
  }
}

// Units with an aura pulse it on their own timer, whether or not they are attacking.
function pulseAura(t, dt) {
  const a = UNITS[t.type].aura;
  if (!a) return;
  t.auraCd = (t.auraCd || 0) - dt;
  if (t.auraCd > 0) return;
  t.auraCd = a.every;
  const o = center(t.x, t.y), r2 = a.radius * a.radius;
  let any = false;
  for (const e of S.enemies)
    if (e.hp > 0 && (e.pos[0] - o[0]) ** 2 + (e.pos[1] - o[1]) ** 2 <= r2) { applySlow(e, a.slow); any = true; }
  if (any) S.flashes.push({ kind: "blast", o, range: a.radius, color: "#bfe6ff", ttl: 0.3, max: 0.3 });
}

// One function per attack kind; every unit template picks one.
const ATTACKS = {
  projectile(t, s, o, inRange, u) {
    const a = s.attack, spread = ((u || 0) - ((t.count || 1) - 1) / 2) * 0.18; // shots leave from slightly different spots
    const from = [o[0] - Math.sin(t.aim) * spread, o[1] + Math.cos(t.aim) * spread];
    const base = { pos: from.slice(), damage: s.damage, speed: a.speed, color: UNITS[t.type].color, ang: t.aim,
                   splash: a.splash || 0, slow: a.slow || null, gold: a.gold || 0, burn: a.burn || null, root: a.root || 0,
                   freeze: a.freeze || 0, freezeMax: a.freezeMax || Infinity, explode: !!a.explode, ball: a.ball || null };
    if (a.pierce) {
      // fired at the furthest enemy, then keeps going in a straight line
      S.projectiles.push({ ...base, dir: [Math.cos(t.aim), Math.sin(t.aim)], travel: a.travel, hitRadius: a.hitRadius, hitSet: new Set(), big: true });
      return;
    }
    for (const e of inRange.slice(0, a.maxHits || 1)) S.projectiles.push({ ...base, pos: from.slice(), target: e });
  },
  // a fire patch on the path under the furthest enemy
  zone(t, s, o, inRange) {
    const a = s.attack, e = inRange[0];
    S.zones.push({ pos: e.pos.slice(), r: a.radius, dps: s.damage, until: S.clock + a.duration, dur: a.duration, src: t.type });
  },
  // single-target melee: strikes only the furthest enemy within reach
  melee(t, s, o, inRange) {
    const sw = s.attack.sweep; // Sweep: now and then the strike becomes a swing at everything in an arc
    if (sw && Math.random() < sw.chance) return ATTACKS.cone(t, { ...s, attack: { kind: "cone", angle: sw.angle } }, o, inRange);
    const e = inRange[0];
    hurt(e, s.damage, t.type);
    if (s.attack.gold && Math.random() < (s.attack.goldChance ?? 1)) stealGold(s.attack.gold, e.pos);
    S.flashes.push({ kind: "slash", o: e.pos.slice(), ang: t.aim + (Math.random() - 0.5) * 0.8, color: UNITS[t.type].color, ttl: 0.15, max: 0.15 });
  },
  // melee area: strikes every enemy within reach at once
  pulse(t, s, o, inRange) {
    for (const e of inRange) { hurt(e, s.damage, t.type); if (s.attack.slow) applySlow(e, s.attack.slow); }
    S.flashes.push({ kind: "blast", o: o.slice(), range: s.range, color: UNITS[t.type].color, ttl: 0.2, max: 0.2 });
  },
  cone(t, s, o, inRange) {
    const half = (s.attack.angle * Math.PI / 180) / 2;
    const hits = inRange.filter(e => {
      let d = Math.atan2(e.pos[1] - o[1], e.pos[0] - o[0]) - t.aim;
      d = Math.atan2(Math.sin(d), Math.cos(d));
      return Math.abs(d) <= half;
    }).slice(0, s.attack.maxHits || Infinity);
    for (const e of hits) hurt(e, s.damage);
    if (s.attack.gold && hits.length) stealGold(s.attack.gold * hits.length, hits[0].pos);
    S.flashes.push({ o, ang: t.aim, half, range: s.range, color: UNITS[t.type].color, ttl: 0.15, max: 0.15 });
  },
};

// all damage goes through here so artifacts like Giant Slayer can adjust it
function hurt(e, d, src) {
  e.hp -= e.isBoss ? d * (1 + 0.15 * al("GiantSlayer")) : d;
  if (e.hp <= 0 && !e.killedBy && src) e.killedBy = src; // remember who landed the killing blow
}

// PLACEHOLDER: items are not designed yet. A drop shows a gem and is counted for the run.
function dropItem(pos) {
  S.itemsFound = (S.itemsFound || 0) + 1;
  S.coins.push({ x: pos[0], y: pos[1], vx: 0, vz: 2.6, z: 0, ttl: 1.4, max: 1.4, item: true });
  toast(`Item drop! (${S.itemsFound} this run · items coming soon)`);
}

// gold stolen by Thief-style hits, with a gold popup
function stealGold(g, pos) {
  S.gold += g;
  dropCoins(g, pos);
}

// Gold feedback: coins pop out, bounce once and fade. One coin per gold, up to 6.
function dropCoins(n, pos) {
  for (let i = 0; i < Math.min(n, 6); i++)
    S.coins.push({ x: pos[0], y: pos[1], vx: (Math.random() - 0.5) * 1.4, vz: 2.2 + Math.random() * 0.8, z: 0, ttl: 0.9, max: 0.9 });
}

function updateProjectiles(dt) {
  for (let i = S.projectiles.length - 1; i >= 0; i--) {
    const p = S.projectiles[i];
    if (p.dir) { // piercing straight shot
      const step = p.speed * dt;
      p.pos[0] += p.dir[0] * step; p.pos[1] += p.dir[1] * step; p.travel -= step;
      p.ang = Math.atan2(p.dir[1], p.dir[0]);
      const r2 = p.hitRadius * p.hitRadius;
      for (const e of S.enemies)
        if (e.hp > 0 && !p.hitSet.has(e) && (e.pos[0] - p.pos[0]) ** 2 + (e.pos[1] - p.pos[1]) ** 2 <= r2) {
          p.hitSet.add(e); impact(p, e);
          if (p.explode) { p.travel = 0; break; } // bursts on the first enemy instead of passing through
        }
      if (p.travel <= 0) S.projectiles.splice(i, 1);
      continue;
    }
    const e = p.target;
    if (e.hp <= 0 || !S.enemies.includes(e)) { S.projectiles.splice(i, 1); continue; }
    const dx = e.pos[0] - p.pos[0], dy = e.pos[1] - p.pos[1], d = Math.hypot(dx, dy), step = p.speed * dt;
    p.ang = Math.atan2(dy, dx);
    if (d <= step) { impact(p, e); S.projectiles.splice(i, 1); continue; }
    p.pos[0] += dx / d * step; p.pos[1] += dy / d * step;
  }
}

// A projectile landing: damage the target, plus everything in the blast, plus any slow.
function impact(p, e) {
  const hit = [e];
  if (p.splash > 0) {
    const r2 = p.splash * p.splash;
    for (const o of S.enemies)
      if (o !== e && o.hp > 0 && (o.pos[0] - e.pos[0]) ** 2 + (o.pos[1] - e.pos[1]) ** 2 <= r2) hit.push(o);
    S.flashes.push({ kind: "blast", o: e.pos.slice(), range: p.splash, color: p.color, ttl: 0.2, max: 0.2 });
  }
  let frozen = 0; // a blast freezes at most freezeMax enemies (all of them still take damage)
  for (const o of hit) {
    hurt(o, p.damage);
    if (p.gold) stealGold(p.gold, o.pos);
    if (p.slow) applySlow(o, p.slow);
    if (p.burn) applyBurn(o, p.burn);
    if (p.root && o === e) applyHold(o, p.root, "root");
    if (p.freeze && frozen < p.freezeMax) { applyHold(o, p.freeze, "freeze"); frozen++; }
  }
}

// Burning enemies take damage every second for the duration; a stronger burn replaces a weaker one.
function applyBurn(e, burn) {
  const active = e.burnUntil && S.clock < e.burnUntil;
  if (!active || burn.dps >= e.burnDps) e.burnDps = burn.dps;
  e.burnUntil = Math.max(active ? e.burnUntil : 0, S.clock + burn.duration);
}

function applySlow(e, slow) {
  const active = e.slowUntil && S.clock < e.slowUntil;
  if (!active || slow.amount >= e.slowAmt) e.slowAmt = slow.amount;
  e.slowUntil = Math.max(active ? e.slowUntil : 0, S.clock + slow.duration);
}

// A tile holds one stack: a single unit type at a single tier, up to 3.
function addUnit(type, preferKey, tier = 1) {
  let k = null;
  for (const [key, t] of S.towers) if (!t.building && t.type === type && tierOf(t) === tier && t.count < STACK_MAX) { k = key; break; }
  if (!k && preferKey && S.board.field.has(preferKey) && !S.towers.has(preferKey)) k = preferKey;
  if (!k) {
    const empty = [...S.board.field].filter(key => !S.towers.has(key));
    if (empty.length) k = empty[Math.floor(Math.random() * empty.length)];
  }
  if (!k) return null;
  const t = S.towers.get(k);
  if (t) { t.count++; t.pop = 1; }
  else { const [x, y] = P(k); S.towers.set(k, { type, tier, count: 1, x, y, cooldown: 0, pop: 1 }); }
  pingUnit(k, type);
  return k;
}

// A new unit arriving (summoned, spawned by a camp, gambled or merged) gets rings pulsing out from it.
function pingUnit(k, type) {
  S.pings = S.pings.filter(p => p.key !== k);
  S.pings.push({ key: k, color: UNITS[type].color, born: time });
}

// The free tile nearest a point (ties at random). Summons and gambles use the burrow, so new units meet enemies
// as they come out; camp units use the camp. A unit that stacks onto an existing tile still goes to that tile.
function nearestFree(pt) {
  let best = null, bd = Infinity;
  for (const k of S.board.field) if (!S.towers.has(k)) {
    const [x, y] = P(k), d = Math.hypot(x + 0.5 - pt[0], y + 0.5 - pt[1]) + Math.random() * 0.01;
    if (d < bd) { bd = d; best = k; }
  }
  return best;
}

// Same-type, same-tier units always share a stack: units from other part-filled stacks of this type and tier move onto
// tile k (up to 3), each flying over. Used where a stack can be left split by a sale.
function stackUp(k) {
  const t = S.towers.get(k);
  if (!t || t.building) return;
  for (const [ok, o] of [...S.towers]) {
    if (t.count >= STACK_MAX) break;
    if (ok === k || o.building || o.type !== t.type || tierOf(o) !== tierOf(t) || o.count >= STACK_MAX) continue;
    const n = Math.min(o.count, STACK_MAX - t.count);
    t.count += n; o.count -= n;
    if (o.count <= 0) { S.towers.delete(ok); if (S.selected === ok) S.selected = null; }
    launchUnit(k, t.type, center(o.x, o.y));
  }
}

function summon() {
  const cost = summonCost();
  if (![...S.board.field].some(k => !S.towers.has(k))) { toast("No free tile: merge, sell or expand."); sfx("no"); return; }
  if (S.gold < cost) { toast("Not enough gold."); sfx("no"); return; }
  S.gold -= cost; S.summonCount++;
  const lucky = Math.random() < UPG_LUCK * up("LuckySummon");
  sfx(lucky ? "lucky" : "summon");
  const type = rollFrom(BASE_UNITS), k = addUnit(type, nearestFree(S.burrow), lucky ? 2 : 1);
  if (k) launchUnit(k, type, els.summon);
  if (lucky) toast("Lucky summon: a Tier 2 unit!");
}

// A reward building pops out of the node it came from and lands on the node's own tile (now part of the field).
// If something is standing there, that walks to the nearest free tile instead; with no free tile at all, the
// building is paid out as gold.
function placeHeldBuildings() {
  while (S.heldBuildings.length) {
    const { type, from = S.burrow } = S.heldBuildings.shift(), spot = K(Math.floor(from[0]), Math.floor(from[1]));
    let k = S.board.field.has(spot) ? spot : nearestFree(from);
    if (k && S.towers.has(k)) {
      const free = nearestFree(from), o = S.towers.get(k);
      if (free) { S.towers.delete(k); [o.x, o.y] = P(free); S.towers.set(free, o); if (S.selected === k) S.selected = null; }
      else k = null;
    }
    if (!k) {
      S.gold += CFG.buildingRefundGold;
      toast(`No free tile for your ${BUILDINGS[type].label}: +${CFG.buildingRefundGold} gold instead.`);
      continue;
    }
    const [x, y] = P(k);
    S.towers.set(k, { building: true, type, level: 1, x, y, pop: 1 });
    launchUnit(k, type, from);
  }
}

function canMerge(t) { return !!t && !t.building && t.count >= STACK_MAX; }

// 3 of a type and tier become one of that type a tier higher (two higher on a lucky merge). The new unit flies into a
// part-filled stack of its type and tier if there is one, else stays on the merged tile.
function merge() {
  const t = S.selected && S.towers.get(S.selected);
  if (!canMerge(t)) return;
  const k = K(t.x, t.y), skip = Math.random() < UPG_LUCK * up("LuckyMerge"), tier = tierOf(t) + (skip ? 2 : 1);
  S.towers.delete(k); sfx(skip ? "luckyMerge" : "merge");
  S.selected = addUnit(t.type, k, tier);
  if (S.selected && S.selected !== k) launchUnit(S.selected, t.type, center(t.x, t.y));
  toast(skip ? `Lucky merge! 3 ${unitName(t.type)}s skipped a tier and became a Tier ${tier} ${unitName(t.type)}!` : `3 ${unitName(t.type)}s became a Tier ${tier} ${unitName(t.type)}!`);
  placeHeldBuildings();
}

const sellValue = t => Math.round(CFG.sellValue * Math.pow(CFG.sellMult, tierOf(t) - 1));

// selling removes one unit from the stack
function sell() {
  const t = S.selected && S.towers.get(S.selected);
  if (!t || t.building) return;
  const g = sellValue(t), ch = sellCharms(t);
  S.gold += g; S.charms += ch; sfx("sell");
  if (t.count > 1) { t.count--; stackUp(S.selected); } else { S.towers.delete(S.selected); S.selected = null; }
  toast(`Sold a ${unitName(t.type)} for ${g} gold${ch ? ` and ${ch} ✦` : ""}.`);
}

// ---------------------------------------------------------------- charms and gambling (this run only)
// Charms come from bosses, claimed nodes, every 5th wave, and selling Tier 2+ units. They're spent on gambles
// for higher-tier units. A miss builds pity: +10% on the next try of the same gamble, reset on a win.
const CHARMS = { boss: 5, node: 2, everyWaves: 5, sell: 1, sellMult: 3 }; // selling pays `sell` at Tier 2, times `sellMult` for each tier above
const sellCharms = t => tierOf(t) >= 2 ? CHARMS.sell * Math.pow(CHARMS.sellMult, tierOf(t) - 2) : 0;
const GAMBLES = {
  rare:   { label: "Tier 2", cost: 1, tier: 2, chance: 0.6 },
  epic:   { label: "Tier 3", cost: 3, tier: 3, chance: 0.3 },
};
const gambleChance = id => Math.min(1, GAMBLES[id].chance + 0.1 * (S.pity[id] || 0));
// A won unit flies out of the button that was pressed and lands like a summon, nearest the burrow.
function gamble(id, from) {
  const g = GAMBLES[id];
  if (S.charms < g.cost) return;
  if (![...S.board.field].some(k => !S.towers.has(k))) { toast("No free tile: sell or expand first."); sfx("no"); return; }
  S.charms -= g.cost;
  if (Math.random() < gambleChance(id)) {
    S.pity[id] = 0; sfx("gambleWin");
    const type = rollFrom(BASE_UNITS), k = addUnit(type, nearestFree(S.burrow), g.tier);
    if (k) launchUnit(k, type, from || els.gamBtn);
    toast(`${g.label} roll: you got a Tier ${g.tier} ${unitName(type)}!`);
  } else {
    S.pity[id] = (S.pity[id] || 0) + 1; sfx("gambleMiss");
    toast(`${g.label} roll missed. Next try: ${Math.round(gambleChance(id) * 100)}%.`);
  }
}
// The gamble panel: a Tier 2 and a Tier 3 roll, each with its chance (including the pity bonus) and cost under the name.
function gamHTML(locked) {
  const noRoom = ![...S.board.field].some(k => !S.towers.has(k));
  let h = `<div class="uhead mid"><b>Gamble</b><button data-close aria-label="Close">×</button></div><div class="ugrid">`;
  for (const [id, g] of Object.entries(GAMBLES))
    h += `<button data-gamble="${id}" class="wide" title="${Math.round(gambleChance(id) * 100)}% chance of a random Tier ${g.tier} unit"`
      + `${S.charms < g.cost || noRoom || locked ? " disabled" : ""}><b>${g.label}</b><small>${Math.round(gambleChance(id) * 100)}%</small>`
      + `<small class="cost">${g.cost} ✦</small></button>`;
  return h + `</div>` + (noRoom ? `<div class="note">Needs a free tile.</div>` : "");
}

function moveTower(fromK, x, y) {
  const toK = K(x, y), a = S.towers.get(fromK);
  S.towers.delete(fromK);
  const b = S.towers.get(toK);
  if (b) { const [fx, fy] = P(fromK); b.x = fx; b.y = fy; S.towers.set(fromK, b); }
  a.x = x; a.y = y; S.towers.set(toK, a);
  S.selected = null; // a move doesn't open the unit's menu (and any selection's tile may now hold another unit)
}

// ---------------------------------------------------------------- expansion & nodes
function buyExpansion(x, y) {
  // classic: between waves only; timed: any time, as long as the tile is clear
  if (S.phase !== "build" && !(S.mode === "timed" && S.phase === "combat")) { S.expandMode = false; return; }
  // the tile you build on must be clear of enemies
  if (S.enemies.some(e => e.hp > 0 && Math.floor(e.pos[0]) === x && Math.floor(e.pos[1]) === y)) { toast("Enemies are on that tile: wait for it to clear."); sfx("no"); return; }
  if (!S.board.isExpandable(x, y)) return;
  const cost = expandCost();
  if (S.gold < cost) { toast("Not enough gold to expand."); sfx("no"); S.expandMode = false; return; }
  S.gold -= cost; S.expandCount++; S.expandMode = false; sfx("expand");
  const res = S.board.expand(x, y);
  S.board.rebase(S.burrow); S.burrow = S.board.path.at(0); // keep the burrow where it was
  for (const n of res.engulfed) claimNode(n);
  if (res.claimed) claimNode(res.claimed);
  // re-seat enemies on the new loop, keeping which lap they're on
  const L2 = S.board.path.length;
  for (const e of S.enemies) {
    const src = e.flight ? e.flight.to : e.pos;
    e.dist = (e.lapIdx || 0) * L2 + S.board.path.closest(src);
    if (e.flight) e.flight.to = S.board.path.at(e.dist); else e.pos = S.board.path.at(e.dist);
  }
  updateNodes();
  S.planks = []; // the path moved; Gangplanks lay new planks
  placeHeldBuildings();
  if (S.pendingRewards > 0) { const back = S.phase; S.phase = "choosing"; offerReward(() => { S.phase = back; closeModal(); }); }
}

// Nodes sleep until the path is next to them. Once awake they buff every enemy until you expand onto them, which
// ends the buff and pays the reward.
function updateNodes() {
  for (const n of S.board.nodes.values())
    if (!n.active && S.board.dist(n.x, n.y) <= 2) activateNode(n);
}

// Node levels: each has an enemy buff that's active while it's awake. From wave 30, each node spawn also brings a
// level 2 node, and from wave 60 a level 3 node too, with stronger buffs.
const NODE_LEVEL_WAVES = [0, 0, 30, 60]; // the wave after which nodes of each level start spawning
const NODE_EFFECTS = {
  tough: { level: 1, label: "Toughness",    glyph: "♥", desc: "enemies spawn with 15% more health",         hp: 0.15 },
  swift: { level: 1, label: "Swiftness",    glyph: "›", desc: "enemies move 10% faster",                    speed: 0.1 },
  haste: { level: 2, label: "Haste",        glyph: "»", desc: "enemies move 20% faster",                  speed: 0.2 },
  regen: { level: 2, label: "Regeneration", glyph: "+", desc: "enemies heal 2% of their health per second", regen: 0.02 },
  dread: { level: 3, label: "Dread",        glyph: "!", desc: "enemies spawn with 30% more health and move 15% faster", hp: 0.3, speed: 0.15 },
};
const NODE_COLORS = [null, "#c2303d", "#7b3fd1", "#2b1a2e"];
// the combined buff from every awake node
function enemyMods() {
  const m = { speed: 1, regen: 0, hp: 1 };
  for (const n of S.board.nodes.values()) {
    if (!n.active || !n.effect) continue;
    const f = NODE_EFFECTS[n.effect];
    m.speed += f.speed || 0; m.regen += f.regen || 0; m.hp += f.hp || 0;
  }
  return m;
}

function activateNode(n) {
  n.active = true; sfx("nodeWake");
  const f = NODE_EFFECTS[n.effect];
  toast(`A node woke up! ${f.label}: ${f.desc} until you expand onto it.`);
}

function claimNode(n) {
  S.board.nodes.delete(K(n.x, n.y));
  S.pendingRewards++;
  S.charms += CHARMS.node; sfx("nodeClaim");
  toast(`Node claimed! +${CHARMS.node} ✦. Choose your reward.`);
}

function spawnNode(level = 1) {
  const effects = Object.keys(NODE_EFFECTS).filter(k => NODE_EFFECTS[k].level === level);
  const effect = effects.length ? effects[Math.floor(Math.random() * effects.length)] : null;
  const b = S.board;
  // a free spot straight out from a field tile (up, down, left or right; never a diagonal corner), so it always
  // takes exactly nodeDistance expands to reach; ignored nodes slowly ring the map
  const d = CFG.nodeDistance;
  const cands = b.ring(d).filter(([x, y]) => !b.nodes.has(K(x, y)) && DIRS.some(([dx, dy]) => b.has(x - dx * d, y - dy * d)));
  if (!cands.length) return;
  const [x, y] = cands[Math.floor(Math.random() * cands.length)];
  b.nodes.set(K(x, y), { x, y, active: false, packId: -1, born: time, level, effect });
  if (!S.nodeHint) { S.nodeHint = true; S.expandEcho = true; sfx("nodeAppear"); toast("A node appeared! When the path gets close, it wakes and buffs the enemies until you expand onto it for a reward."); }
}

// ---------------------------------------------------------------- waves
// Camps send out their free unit as a wave starts: it's launched from the camp and lands on the free tile
// nearest the camp (or on its matching stack).
function campsSpawn() {
  const sent = [];
  for (const c of [...S.towers.values()]) {
    const b = c.building && BUILDINGS[c.type];
    if (!b || !b.spawns) continue;
    const k = addUnit(b.spawns, nearestFree(center(c.x, c.y)));
    if (!k) continue; // no room
    launchUnit(k, b.spawns, center(c.x, c.y));
    sent.push(unitName(b.spawns));
  }
  if (sent.length) toast(`Camps sent out: ${sent.join(", ")}`);
}

function startWave() {
  if (S.phase !== "build" && S.phase !== "combat") return;
  S.snap = takeSnap(); // the board as this wave starts: what Quit saves
  S.waveTime = 0; S.waveLive = true; S.prep = 0;
  S.spawned = 0; S.spawnTimer = 0; S.graceTimer = 0; S.bossTimer = 0; S.bossSpawned = false;
  S.spawnList = [...S.spawnList, ...nextWaveList().map(e => ({ ...e, left: e.count }))]; // timed: unspawned enemies carry over
  if (S.pendingEntries.length) toast(`Node guards join this wave: ${describeList(S.pendingEntries)}.`);
  S.pendingEntries = [];
  if (S.mode !== "timed") S.expandMode = false;
  campsSpawn();
  S.phase = "combat";
  if (isBossWave(S.wave)) toast("Boss wave: the Grub Mother is coming!"); else sfx("waveStart");
}

function endWave() {
  const done = S.wave;
  const interest = interestNow(), mines = 8 * countBuildings("Mine"), pigeon = 5 * al("CourierPigeon");
  const gold = CFG.waveClearBonus + interest + mines + pigeon, charm = done % CHARMS.everyWaves === 0 ? 1 : 0;
  S.gold += gold; S.loot += CFG.lootPerWave + S.lootBonus; S.charms += charm; sfx("waveEnd");
  // what the wave earned pops up above the gold and charms, with a breakdown underneath
  coinPop(`+${gold}` + (charm ? ` · +${charm} ✦` : ""),
    [`wave ${CFG.waveClearBonus}`, interest && `interest ${interest}`, mines && `Mines ${mines}`, pigeon && `Pigeon ${pigeon}`].filter(Boolean).join(" · "));
  if (done >= CFG.firstNodeAfterWave && (done - CFG.firstNodeAfterWave) % CFG.nodeEvery === 0) {
    // higher-level nodes come on top of the usual one, so late runs get more (and nastier) nodes
    spawnNode(1);
    if (done >= NODE_LEVEL_WAVES[2]) spawnNode(2);
    if (done >= NODE_LEVEL_WAVES[3]) spawnNode(3);
  }
  S.wave++;
  const after = () => {
    if (S.mode === "timed") {
      S.phase = "combat"; closeModal();
      if (isBossWave(done)) { S.waveLive = false; S.prep = S.prepFull = CFG.bossBreak; } // after a boss: a flat breather, then the next wave
      else startWave();                                                                    // otherwise the next wave arrives on time
    }
    else { S.phase = "build"; closeModal(); }                                         // classic: wait for the player
  };
  if (S.pendingRewards > 0) { S.phase = "choosing"; offerReward(after); }
  else after();
}

// Node rewards: always the same three, in the same three slots (buildings are no longer offered).
const NODE_PERKS = {
  EnemyCap: { label: () => `+${CFG.nodeCapBonus} enemy limit`, desc: () => `The board holds ${CFG.nodeCapBonus} more enemies before the countdown starts.`,
              apply: () => { S.enemyCap += CFG.nodeCapBonus; } },
  MoreEnemies: { label: () => `+${CFG.nodeEnemyReward.count} enemies`,
                 desc: () => `${CFG.nodeEnemyReward.count} more ${ENEMIES[CFG.nodeEnemyReward.unit].label}s every wave (it takes a little longer to come out): more kill gold, and +${CFG.nodeEnemyLoot} loot per wave.`,
                 apply: () => { S.waveExtras.push({ ...CFG.nodeEnemyReward }); S.lootBonus += CFG.nodeEnemyLoot; } },
  Damage: { label: () => `+${Math.round(CFG.nodeDamageBonus * 100)}% damage`, desc: () => `Every unit deals ${Math.round(CFG.nodeDamageBonus * 100)}% more damage for the rest of the run (picks add up).`,
            apply: () => { S.damageBonus += CFG.nodeDamageBonus; } },
};

// Pick 1 of the 3 rewards for each node claimed, shown in the same order every time.
function offerReward(after) {
  const done = () => { S.pendingRewards--; if (S.pendingRewards > 0) offerReward(after); else after(); };
  openModal(S.pendingRewards > 1 ? `Node reward (${S.pendingRewards} to pick)` : "Node reward", "Choose a reward.",
    Object.values(NODE_PERKS).map(p => ({ label: p.label(), sub: p.desc(), onClick: () => { p.apply(); sfx("upgrade"); done(); } })), true);
}

function endRun(cashOut, reason) {
  S.cashedOut = cashOut; S.endReason = reason;
  if (S.resumed) clearSave(); // a run continued from the save is over: the save goes with it
  S.finalLoot = cashOut ? S.loot : Math.floor(S.loot * CFG.deathKeepFraction);
  S.phase = "over"; S.selected = null; S.drag = null; sfx(cashOut ? "bossDown" : "lose");
  META.loot += S.finalLoot; saveMeta();
  openGameOver(META.loot);
}

function tickCombat(dt) {
  S.clock += dt;
  const boss = isBossWave(S.wave);
  if (S.spawnList.length) {
    S.spawnTimer -= dt;
    while (S.spawnTimer <= 0 && S.spawnList.length) {
      const entry = S.spawnList[0];
      spawnUnit(entry.unit, 0, entry.packId ?? -1);
      S.spawned++; S.spawnTimer += entry.delay;
      if (--entry.left <= 0) S.spawnList.shift();
    }
  }
  if (S.boss) S.bossTimer += dt;
  moveEnemies(dt);
  tickZones(dt);
  tickPlanks();
  towersAttack(dt);
  updateProjectiles(dt);
  cleanupDead();
  if (S.hp <= 0) { S.hp = 0; endRun(false, "The grubs wore down your defenses."); return; }
  // enemy limit: over it, a countdown runs; drop back under and it resets
  if (limitMode()) {
    if (boardLoad() > S.enemyCap) {
      if (!S.overTime) sfx("warn");
      if (!S.overTime) toast(`Over the enemy limit! Get back under ${S.enemyCap} within ${CFG.overCapTime}s.`);
      S.overTime = (S.overTime || 0) + dt;
      if (S.overTime >= CFG.overCapTime) { endRun(false, "Too many enemies on the board for too long."); return; }
    } else S.overTime = 0;
  }
  // classic: the wave lasts until everything it spawned is dead
  if (S.mode !== "timed") { if (!S.spawnList.length && !S.enemies.length) endWave(); return; }
  // timed: a normal wave ends when its timer runs out, enemies or not; the boss wave waits for the boss, who must
  // die before her own timer runs out
  if (!S.waveLive) {
    S.prep -= dt;
    if (S.prep <= 0) startWave();
    return;
  }
  S.waveTime += dt;
  if (S.boss && S.bossLeft != null && (S.bossLeft -= dt) <= 0) { S.bossLeft = 0; endRun(false, "The Grub Mother wasn't defeated in time."); return; }
  if (isBossWave(S.wave)) { if (S.bossSpawned && !S.boss && !S.spawnList.length) endWave(); }
  else if (S.waveTime >= CFG.waveDuration) endWave();
}

// ---------------------------------------------------------------- rendering
const canvas = document.getElementById("c");
let ctx = canvas.getContext("2d"); // swapped briefly to draw unit icons for the info panel
let W = 0, H = 0, DPR = 1;
const cam = { x: 1.5, y: 1.5, s: 60 };

// W/H are design-frame units; the backing store also covers the frame's scale so the board stays sharp
function resize() {
  const r = canvas.getBoundingClientRect();
  W = canvas.clientWidth || r.width; H = canvas.clientHeight || r.height;
  DPR = Math.min((window.devicePixelRatio || 1) * (W ? r.width / W : 1), 4);
  canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
}
new ResizeObserver(resize).observe(canvas);

// scale the fixed 450x800 frame to the window: as large as fits with a 16px margin, or fill a phone-shaped screen
const FRAME_W = 450, FRAME_H = 800;
function fitFrame() {
  const app = document.getElementById("app"), vw = window.innerWidth, vh = window.innerHeight;
  if (!app.style || !vw) return;
  const full = vw / vh <= FRAME_W / FRAME_H || vw <= 500;
  const k = full ? vw / FRAME_W : Math.min((vw - 32) / FRAME_W, (vh - 32) / FRAME_H);
  app.classList.toggle("full", full);
  app.style.setProperty("--k", k); app.style.setProperty("--fh", (full ? vh / k : FRAME_H) + "px");
  resize();
}
if (window.addEventListener) window.addEventListener("resize", fitFrame);

function fitCamera(dt, instant) {
  const { minX, minY, maxX, maxY } = S.board.bounds();
  let x0 = minX - 1.3, y0 = minY - 1.3, x1 = maxX + 2.3, y1 = maxY + 2.3;
  // keep every node in view so players can see what they are working toward
  for (const n of S.board.nodes.values()) {
    x0 = Math.min(x0, n.x - 0.5); y0 = Math.min(y0, n.y - 0.5);
    x1 = Math.max(x1, n.x + 1.5); y1 = Math.max(y1, n.y + 1.5);
  }
  const s = Math.min(W / (x1 - x0), (H - 30) / (y1 - y0));
  const cx = (x0 + x1) / 2, cy = (y0 + y1) / 2 - 12 / Math.max(s, 1);
  fit.s = s; fit.x = cx; fit.y = cy;
  // the player's pan can't leave the area the auto-fit covers (the board, its margin and the nodes)
  view.px = Math.max(x0 - cx, Math.min(x1 - cx, view.px)); view.py = Math.max(y0 - cy, Math.min(y1 - cy, view.py));
  const k = instant || view.fast ? 1 : 1 - Math.exp(-6 * dt); view.fast = false; // dragging and pinching follow the fingers exactly
  cam.s += (s * view.zoom - cam.s) * k; cam.x += (cx + view.px - cam.x) * k; cam.y += (cy + view.py - cam.y) * k;
}
// The player's own view on top of the auto-fit: a zoom multiplier and a pan in tiles. Reset (Fit button, new run) = 1 and 0.
const fit = { s: 60, x: 1.5, y: 1.5 }, view = { zoom: 1, px: 0, py: 0, fast: false }, ZOOM_MIN = 0.6, ZOOM_MAX = 4;
// Zoom by a factor, keeping the board point under (sx, sy) (frame units) where it is.
function zoomAt(f, sx, sy) {
  const z = Math.max(ZOOM_MIN, Math.min(ZOOM_MAX, view.zoom * f));
  if (z === view.zoom) return;
  const ts = fit.s * view.zoom, wx = fit.x + view.px + (sx - W / 2) / ts, wy = fit.y + view.py - (sy - H / 2) / ts, ns = fit.s * z;
  view.zoom = z; view.px = wx - (sx - W / 2) / ns - fit.x; view.py = wy + (sy - H / 2) / ns - fit.y;
}
// Pan by a screen distance (frame units): the board follows the finger.
function panBy(dx, dy) { const ts = fit.s * view.zoom; view.px -= dx / ts; view.py += dy / ts; view.fast = true; }
const resetView = () => { view.zoom = 1; view.px = view.py = 0; };
const toScreen = (x, y) => [W / 2 + (x - cam.x) * cam.s, H / 2 - (y - cam.y) * cam.s];
const toWorld = (sx, sy) => [cam.x + (sx - W / 2) / cam.s, cam.y - (sy - H / 2) / cam.s];

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function circle(x, y, r, fill, stroke, lw) {
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.lineWidth = lw || 2; ctx.stroke(); }
}

function drawBody(shape, x, y, size, fill, edge) {
  const h = size / 2;
  if (shape === "square") roundRect(x - h, y - h, size, size, size * 0.18);
  else {
    ctx.beginPath();
    if (shape === "circle") ctx.arc(x, y, h, 0, Math.PI * 2);
    else if (shape === "diamond") { ctx.moveTo(x, y - h * 1.15); ctx.lineTo(x + h * 1.15, y); ctx.lineTo(x, y + h * 1.15); ctx.lineTo(x - h * 1.15, y); ctx.closePath(); }
    else if (shape === "triangle") { ctx.moveTo(x, y - h * 1.2); ctx.lineTo(x + h * 1.15, y + h * 0.85); ctx.lineTo(x - h * 1.15, y + h * 0.85); ctx.closePath(); }
    else if (shape === "hex") {
      for (let i = 0; i < 6; i++) { const a = Math.PI / 6 + i * Math.PI / 3, px = x + Math.cos(a) * h * 1.1, py = y + Math.sin(a) * h * 1.1; if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py); }
      ctx.closePath();
    }
  }
  ctx.fillStyle = fill; ctx.fill(); ctx.strokeStyle = edge; ctx.lineWidth = 2.5; ctx.stroke();
}

function drawIcon(icon, x, y, size, s) {
  ctx.strokeStyle = ctx.fillStyle = "rgba(255,255,255,0.92)";
  ctx.lineWidth = Math.max(1.5, s * 0.04);
  ctx.beginPath();
  if (icon === "bow") {
    ctx.arc(x - size * 0.05, y, size * 0.22, -Math.PI / 2.4, Math.PI / 2.4);
    ctx.moveTo(x - size * 0.15, y); ctx.lineTo(x + size * 0.25, y); ctx.stroke();
  } else if (icon === "sword") {
    ctx.moveTo(x - size * 0.2, y + size * 0.2); ctx.lineTo(x + size * 0.2, y - size * 0.2);
    ctx.moveTo(x - size * 0.2, y - size * 0.02); ctx.lineTo(x - size * 0.02, y + size * 0.2); ctx.stroke();
  } else if (icon === "bomb") {
    ctx.arc(x - size * 0.03, y + size * 0.05, size * 0.15, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.moveTo(x + size * 0.07, y - size * 0.06);
    ctx.quadraticCurveTo(x + size * 0.18, y - size * 0.24, x + size * 0.26, y - size * 0.18); ctx.stroke();
  } else if (icon === "coin") {
    ctx.arc(x, y, size * 0.2, 0, Math.PI * 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x, y - size * 0.11); ctx.lineTo(x, y + size * 0.11); ctx.stroke();
  } else if (icon === "star") {
    for (let i = 0; i < 10; i++) {
      const a = -Math.PI / 2 + i * Math.PI / 5, r = (i % 2 ? 0.08 : 0.2) * size;
      const px = x + Math.cos(a) * r, py = y + size * 0.06 + Math.sin(a) * r;
      if (i) ctx.lineTo(px, py); else ctx.moveTo(px, py);
    }
    ctx.closePath(); ctx.fill();
  }
}

function drawBuilding(t, sx, sy, s, sel) {
  const b = BUILDINGS[t.type], h = s * 0.36;
  if (t === sel) { roundRect(sx - s * 0.46, sy - s * 0.46, s * 0.92, s * 0.92, s * 0.14); ctx.strokeStyle = COLORS.select; ctx.lineWidth = 3; ctx.stroke(); }
  ctx.beginPath(); ctx.moveTo(sx - h, sy - h * 0.1); ctx.lineTo(sx, sy - h * 1.05); ctx.lineTo(sx + h, sy - h * 0.1); ctx.closePath();
  ctx.fillStyle = b.dark; ctx.fill();
  roundRect(sx - h * 0.8, sy - h * 0.15, h * 1.6, h * 1.1, h * 0.12);
  ctx.fillStyle = b.color; ctx.fill(); ctx.strokeStyle = b.dark; ctx.lineWidth = 2; ctx.stroke();
  ctx.fillStyle = "#fff"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
  ctx.font = `800 ${Math.round(h * 0.9)}px "Baloo 2", system-ui, sans-serif`;
  ctx.fillText(b.glyph, sx, sy + h * 0.42);
}

// A grub: a head with two body segments trailing behind, wiggling as it crawls.
function drawGrub(x, y, r, fill, edge, dir, walk) {
  const bx = -Math.cos(dir), by = Math.sin(dir); // screen-space direction pointing backward
  const px = -by, py = bx;                        // sideways, for the wiggle
  const segs = [[1.5, 0.55], [0.8, 0.75]];        // [distance back, size], drawn tail first
  segs.forEach(([d, sc], i) => {
    const w = Math.sin(walk - (i + 1) * 1.3) * r * 0.25;
    circle(x + bx * r * d + px * w, y + by * r * d + py * w, r * sc, fill, edge, 2);
  });
  const squash = 1 + 0.08 * Math.sin(walk * 2);

// New units (summoned, gambled, sent by a camp) shoot out of where they came from in an arc and land on their

  const t = S.towers.get(k);
  if (t.building || t.count === 1) t.landAt = time + FLY_TIME;
  const p = S.pings.find(p => p.key === k); if (p) p.born = time + FLY_TIME; // rings pulse on landing
  let src;
  if (Array.isArray(from)) src = { world: from };
  else { const r = from.getBoundingClientRect(); src = { screen: [r.left + r.width / 2, r.top + r.height / 2] }; }
  S.flyers.push({ key: k, type, born: time, src });
}
function drawFlyers() {
  const fw = fxCanvas.clientWidth, fh = fxCanvas.clientHeight;
  if (!fw || (!S.flyers.length && !fxDrawn)) return;
  if (fxCanvas.width !== Math.round(fw * DPR)) { fxCanvas.width = Math.round(fw * DPR); fxCanvas.height = Math.round(fh * DPR); }
  fxCtx.setTransform(DPR, 0, 0, DPR, 0, 0); fxCtx.clearRect(0, 0, fw, fh);
  fxDrawn = S.flyers.length > 0;
  if (!fxDrawn) return;
  // everything in frame units: board origin and button centre relative to the overlay
  const fr = fxCanvas.getBoundingClientRect(), k = fr.width / fw, cr = canvas.getBoundingClientRect();
  const ox = (cr.left - fr.left) / k, oy = (cr.top - fr.top) / k, s = cam.s;
  const main = ctx; ctx = fxCtx;
  for (let i = S.flyers.length - 1; i >= 0; i--) {
    const f = S.flyers[i], t = S.towers.get(f.key), p = (time - f.born) / FLY_TIME;
    if (!t || p >= 1) { if (t) t.pop = 1; S.flyers.splice(i, 1); continue; }
    let fx0, fy0;
    if (f.src.world) { [fx0, fy0] = toScreen(f.src.world[0], f.src.world[1]); fx0 += ox; fy0 += oy; }
    else { fx0 = (f.src.screen[0] - fr.left) / k; fy0 = (f.src.screen[1] - fr.top) / k; }
    const [tx, ty] = toScreen(t.x + 0.5, t.y + 0.5), e = 1 - (1 - p) * (1 - p); // eased: fast out of the source
    const gx = fx0 + (tx + ox - fx0) * e, gy = fy0 + (ty + oy - fy0) * e;
    const lift = Math.sin(Math.PI * p) * Math.min(s * 1.6, s * 0.6 + Math.hypot(tx + ox - fx0, ty + oy - fy0) * 0.35); // short hops stay low
    const u = UNITS[f.type], tier = tierOf(t), grow = 0.6 + 0.4 * p, size = (!u ? 0.72 : 0.5 + 0.06 * Math.min(tier, 4)) * s * grow;
    ctx.globalAlpha = 0.25 * p; circle(gx, gy, size * 0.45, "rgba(0,0,0,0.6)"); ctx.globalAlpha = 1; // shadow
    ctx.save(); ctx.translate(gx, gy - lift);
    if (!u) drawBuilding({ type: f.type }, 0, 0, s * grow, null); // a building: no spin
    else { ctx.rotate((1 - e) * -Math.PI * 2); drawUnitFigure(f.type, 0, 0, size, s, tier); }
    ctx.restore();
  }
  ctx = main;
}

// A unit's figure: family shape and icon, with a glow for Tier 2 and up.
function drawUnitFigure(id, sx, sy, size, s, tier = 1) {
  const u = UNITS[id], f = FAMILIES[u.family], rim = tierRim(tier);
  if (rim) { ctx.save(); ctx.shadowColor = rim; ctx.shadowBlur = size * 0.4; drawBody(f.shape, sx, sy, size * 1.1, rim, rim); ctx.restore(); }
  drawBody(f.shape, sx, sy, size, u.color, u.dark);
  drawIcon(f.icon, sx, sy, size, s);
}

// small images of unit figures for the info panel
const imgCache = {};
function unitImg(id) {
  if (imgCache[id]) return imgCache[id];
  const c = document.createElement("canvas"); c.width = c.height = 60;
  const saved = ctx; ctx = c.getContext("2d"); ctx.lineJoin = "round";
  drawUnitFigure(id, 30, 30, 34, 50);
  ctx = saved;
  return (imgCache[id] = c.toDataURL());
}

// Where a unit is drawn: its visual position, which glides to its tile, so moved and swapped units visibly walk
// over instead of jumping. While dragged it stays put; a ghost follows the pointer instead (see draw).
function towerPos(t) {
  if (!t.vis) t.vis = center(t.x, t.y);
  return t.vis;
}

// The selected unit's skills and attack effects, as small tags; each opens a short description when tapped.
function unitTags(s) {

  if (a.sweep) tag("sweep", "Sweep", `Each attack has a ${Math.round(a.sweep.chance * 100)}% chance to swing in a ${a.sweep.angle}° arc and hit every enemy in it.`);
  if (s.rapid) tag("rapid", "Rapid fire", `Every ${s.rapid.every}s, when an enemy is in reach, it shoots ${s.rapid.mult}x as fast for ${s.rapid.duration}s.`);
  if (a.kind === "cone") tag("cone", "Cleave", `Hits up to ${a.maxHits} enemies in a ${a.angle}° cone in front of it.`);
  if (a.kind === "zone") tag("zone", "Fire patch", `Sets the path under the furthest enemy on fire for ${a.duration}s; its damage is per second, to everything standing in it.`);
  if (a.pierce) tag("pierce", a.explode ? "Snowball" : "Cannonball", a.explode ? `Flies straight for up to ${a.travel} tiles and bursts on the first enemy it reaches.` : `Flies straight for ${a.travel} tiles, hitting every enemy it passes.`);
  if (a.slow) tag("slow", "Slow", `Hits slow enemies by ${Math.round(a.slow.amount * 100)}% for ${a.slow.duration}s.`);
  if (a.burn) tag("burn", "Burn", `Sets enemies alight: ${a.burn.dps} damage per second for ${a.burn.duration}s.`);
  if (a.root) tag("root", "Entangle", `Vines hold the target in place for ${a.root}s (bosses half as long).`);
  if (a.freeze) tag("freeze", "Freeze", `The blast freezes up to ${a.freezeMax || "all"} enemies for ${a.freeze}s (bosses half as long).`);
  if (a.gold) tag("gold", "Steal", a.goldChance ? `Each hit has a ${Math.round(a.goldChance * 100)}% chance to steal ${a.gold} gold.` : `Each hit steals ${a.gold} gold.`);
  if (a.itemChance) tag("item", "Plunder", `${Math.round(a.itemChance * 100)}% chance of an item drop on a kill (items coming soon).`);
  if (s.skill) tag("skill", "Shield Bash", `Every ${s.skill.every}s, bashes the furthest enemy in reach and stuns it for ${s.skill.stun}s.`);
  if (s.ramp) tag("ramp", "Frenzy", `Attacks faster the longer it keeps fighting, up to ${Math.round(s.ramp.max * 100)}% faster; resets after ${s.ramp.reset}s without attacking.`);
  if (s.secondary) tag("sec", s.secondary.name[0].toUpperCase() + s.secondary.name.slice(1), `A second weapon: ${s.secondary.damage} damage every ${+(1 / s.secondary.aps).toFixed(1)}s, range ${s.secondary.range}.`);
  if (s.plank) tag("plank", "Walk the Plank", `Lays a plank on a path tile next to it (needs an edge tile). The first enemy to step on it is flipped across the board. A boss is too heavy: the plank snaps and this unit is stunned for ${(s.plank.heavy && s.plank.heavy.stun) || 0}s. A new plank comes ${s.plank.every}s after each use.`);
  if (s.spin) tag("spin", "Flame Spin", `Every ${s.spin.every}s, spins for ${s.spin.duration}s, hitting everything within ${s.spin.radius} tiles for ${s.spin.damage} every ${s.spin.tick}s and setting it alight.`);

// The unit info pill at the top of the board: name and tier, four stat cells (damage, speed, range, AoE), and tags

function infoHTML(sel) {

  const u = UNITS[sel.type], s = boosted(sel), a = s.attack;
  const aoe = a.splash ? `${a.splash} tiles` : a.kind === "pulse" ? `${s.range} tiles` : a.sweep ? `${a.sweep.angle}° sweep` : a.kind === "cone" ? `${a.angle}°` : a.kind === "zone" ? `${a.radius} tiles` : s.spin ? `${s.spin.radius} spin` : "—";
  const cell = (k, v) => `<div><small>${k}</small><b>${v}</b></div>`;
  let h = `<div class="head"><span class="name">${unitName(sel.type)}</span><span class="muted">`
    + `Tier ${tierOf(sel)} · stack ${sel.count}/${STACK_MAX}` + `</span></div>`;
  h += `<div class="stats">${cell("Damage", +s.damage.toFixed(1) + (sel.count > 1 ? ` ×${sel.count}` : "") + (a.kind === "zone" ? "/s" : ""))}`
    + `${cell("Speed", `${s.aps}/s`)}${cell("Range", s.range)}${cell("AoE", aoe)}</div>`;
  const tags = unitTags(s);
  if (drumsNear(sel)) tags.push({ id: "drum", label: "War Drum", text: `A War Drum next to it adds ${25 * drumsNear(sel)}% damage.` });

// The buttons that float on the selected unit: Sell on top and Merge on the bottom, with a gap for the unit between them.
function unitBtnsHTML(sel, locked) {
  if (!sel || sel.building) return "";
  const dis = locked ? " disabled" : "";
  const b = canMerge(sel) && !locked ? `<button class="primary" data-merge>Merge</button>` : `<button data-merge disabled>Merge</button>`;
  return `<div class="ut"><button data-sell${dis}>Sell +${sellValue(sel)}g${sellCharms(sel) ? ` +${sellCharms(sel)}✦` : ""}</button></div>`
    + `<div class="ugap"></div><div class="ub">${b}</div>`;
}

// Sell sits just above the selected unit and Merge just below. With no room above (the info pill is in the way),
// both rows go below the unit, Sell first, and never under the pill. Kept inside the board.
function placeUnitBtns(sel) {
  const el = els.ubtns, show = !!sel && !sel.building && !(S.drag && S.drag.moved);
  if (el.hidden !== !show) el.hidden = !show;
  if (!show || !el.children[1]) return;
  const pos = towerPos(sel), [sx, sy] = toScreen(pos[0], pos[1]), s = cam.s, th = el.children[0].offsetHeight;
  const pill = els.info.hidden ? 0 : $("topstack").offsetTop + els.info.offsetTop + els.info.offsetHeight;
  const around = sy - s * 0.55 - th > pill + 4;
  el.children[1].style.height = (around ? s * 1.1 : 6) + "px";
  const w = el.offsetWidth;
  el.style.left = Math.max(4, Math.min(W - w - 4, sx - w / 2)) + "px";

function updateHUD() {
  const overlay = S.phase === "over" || S.phase === "choosing" || S.phase === "shop" || S.phase === "menu";
  // Home and the Workshop are full screens: no stat bar or action buttons
  const noGame = S.phase === "menu" || S.phase === "shop";
  if (cache.noGame !== noGame) { cache.noGame = noGame; app.classList.toggle("nogame", noGame); }
  setHTML("wave", els.wave, `<b>Wave ${S.wave}${isBossWave(S.wave) ? " · Boss" : ""}</b>`);
  const lim = limitMode(), load = boardLoad(), over = lim && load > S.enemyCap;
  if (lim) { // over the limit, the countdown joins the line
    setHTML("hp", els.hp, `<b>${load}</b><span>/ ${S.enemyCap} enemies</span>` + (over ? `<span>· ${Math.max(0, Math.ceil(CFG.overCapTime - S.overTime))}s until you lose</span>` : ""));
    els.hp.classList.toggle("danger", load > S.enemyCap * 0.8);
  } else {
    setHTML("hp", els.hp, `<b>${S.hp}</b><span>/ ${S.maxHp} HP</span>`);
    els.hp.classList.toggle("danger", S.hp <= S.maxHp * 0.3);
  }
  // classic also shows the enemies on the board; timed has the limit line only
  if (els.enemies.hidden !== lim) els.enemies.hidden = lim;
  if (!lim) setHTML("en", els.enemies, `<b>${S.enemies.length}</b><span>enemies</span>`);
  setHTML("gold", els.gold, `<b>${S.gold}</b><span>gold</span>`);
  setHTML("loot", els.loot, `<b>${S.loot}</b><span>loot</span>`);
  setHTML("charms", els.charms, `<b>${S.charms}</b><span>✦ charms</span>`);
  const left = remainingToSpawn();
  let ph = "";
  // timed: the countdown lives on the burrow; the header says what's coming
  if (S.phase === "combat") ph = S.mode !== "timed" ? (left > 0 ? `${left} left to spawn` : `Clear ${S.enemies.length} more`)
    : S.waveLive && isBossWave(S.wave) ? (left > 0 ? `${left} left to spawn` : `Defeat the boss` + (S.bossLeft != null ? ` · ${Math.ceil(S.bossLeft)}s` : ""))
    : `Next: ${describeList(nextWaveList(S.waveLive ? S.wave + 1 : S.wave))}`;
  else if (S.phase === "build") {
    const boosts = [...S.board.nodes.values()].filter(n => n.active && n.effect).map(n => NODE_EFFECTS[n.effect].label);
    ph = `Next: ${describeList(nextWaveList())}` + (boosts.length ? ` · enemy boosts: ${boosts.join(", ")}` : "");
  }
  if (S.phase === "combat" && S.boss && S.mode !== "timed") { // laps only cost health in Classic
    const hit = S.boss.laps * (ENEMIES[S.boss.kind].damageMult || 1);
    ph = `Grub Mother lap ${S.boss.laps + 1}: ` + (hit ? `hits for ${hit}` : "no damage yet");
  }
  setText("phase", els.phase, ph);

  setHTML("toasts", els.toasts, S.toasts.map(t => `<div class="toast">${t.text}</div>`).join(""));

  const sel = S.selected && S.towers.get(S.selected);
  let hint = "";
  if (sel && sel.building) {
    const b = BUILDINGS[sel.type];
    hint = `${b.label}: ${b.desc}` + (b.favors ? ` Tier 1 ${b.favors} odds now ${Math.round(oddsIn(BASE_UNITS, b.favors) * 100)}%.` : "") + " Drag to move.";
  }
  else if (sel) hint = "";
  else if (S.expandMode) hint = `Tap a green tile to expand for ${expandCost()}g. A node wakes when the path touches it.`;
  else if (S.phase === "build" && S.towers.size === 0) hint = "Summon a few towers, then start the wave.";
  setText("hint", els.hint, hint);
  setDis("quitD", els.quit, overlay);
  setText("sound", els.sound, `Sound: ${META.mute ? "off" : "on"}`);
  if (cache.infoSel !== sel) { cache.infoSel = sel; S.infoTag = null; } // a newly selected unit starts with its tags closed
  const ih = infoHTML(sel), upgOpen = !els.upg.hidden || !els.gam.hidden;
  if (!els.gam.hidden) setHTML("gam", els.gam, gamHTML(overlay));
  setHTML("info", els.info, ih);
  if (els.info.hidden !== !ih) els.info.hidden = !ih;
  if (upgOpen) setHTML("upg", els.upg, upgHTML(overlay));
  setHTML("ubtns", els.ubtns, unitBtnsHTML(sel, overlay));
  placeUnitBtns(sel);

  const cost = summonCost();
  setHTML("summon", els.summon, `Summon<small>${cost}g</small>`);
  setDis("summonD", els.summon, overlay || S.gold < cost || S.board.field.size <= S.towers.size);
  const ec = expandCost();
  const expandNow = S.phase === "build" || (S.mode === "timed" && S.phase === "combat");
  setHTML("expand", els.expand, S.expandMode ? "Cancel<small>expand</small>" : !expandNow && S.phase === "combat" ? "Expand<small>after wave</small>" : `Expand<small>${ec}g</small>`);
  setDis("expandD", els.expand, overlay || !expandNow || (!S.expandMode && S.gold < ec));
  els.expand.classList.toggle("primary", S.expandMode);
  els.expand.classList.toggle("echo", !!S.expandEcho);
  setText("speed", els.speed, `Speed ${S.speed}×`);
  setDis("speedD", els.speed, speeds().length < 2); // faster speeds come from Research
}

// ---------------------------------------------------------------- workshop screen
// Three full screens share this element: the Workshop (unit upgrades), Research (speed, economy, quality of life)
// and Artifacts (unlock, level, equip 3). Each has one way out: back to the main menu.
let shopView = "workshop";
function renderShop() {
  const row = (name, tag, now, next, btns) =>
    `<div class="item"><div class="txt"><b>${name}</b> <span class="muted">${tag}</span><small>${now}${next ? ` → ${next}` : ""}</small></div>${btns}</div>`;
  const art = shopView === "artifacts", res = shopView === "research";
  let h = `<h2>${art ? "Artifacts" : res ? "Research" : "Workshop"}</h2><div class="muted">Loot: <b>${META.loot}</b> · `
    + (art ? `Unlock and level artifacts with loot, and equip up to ${ARTIFACT_SLOTS}; equipped ones apply from your next run.</div>`
      : res ? "Permanent upgrades to game speed, your economy and quality of life. They apply from your next run.</div>"
      : "Permanent unit upgrades. None yet: units grow by merging.</div>");
  if (res) for (const [id, r] of Object.entries(RESEARCH)) {
    const l = rl(id), c = r.cost(l), maxed = l >= r.max, locked = r.needs && !rl(r.needs);
    h += row(r.label, r.max > 1 ? `Lv ${l}/${r.max}` : l ? "Done" : "", l ? r.desc(l) : locked ? `Needs ${RESEARCH[r.needs].label} first` : "Not researched yet",
      maxed || locked ? "" : r.desc(l + 1),
      maxed ? `<button disabled>${r.max > 1 ? "Maxed" : "Done"}</button>` : `<button data-research="${id}"${META.loot < c || locked ? " disabled" : ""}>Research · ${c}</button>`);
  }
  if (!art && !res && Object.keys(WORKSHOP).length) h += `<h3>Unit upgrades</h3>`;
  if (!art && !res) for (const [id, w] of Object.entries(WORKSHOP)) {
    const l = wl(id), c = w.cost(l), maxed = l >= w.max;
    h += row(w.label, `Lv ${l}/${w.max}`, l ? w.desc(l) : "Not bought yet", maxed ? "" : w.desc(l + 1),
      maxed ? `<button disabled>Maxed</button>` : `<button data-buy="${id}"${META.loot < c ? " disabled" : ""}>Buy · ${c}</button>`);
  }
  if (art) h += `<h3>Equipped <span class="muted">· ${META.equipped.length}/${ARTIFACT_SLOTS}</span></h3>`;
  if (art) for (const [id, a] of Object.entries(ARTIFACTS)) {
    const l = META.artifacts[id] || 0, eq = META.equipped.includes(id);
    let btns, tag;
    if (!l) { tag = "Locked"; btns = `<button data-unlock="${id}"${META.loot < a.unlock ? " disabled" : ""}>Unlock · ${a.unlock}</button>`; }
    else {
      tag = a.max > 1 ? `Lv ${l}/${a.max}` : "Owned";
      const c = a.upCost(l);

        + `<button data-equip="${id}" class="${eq ? "primary" : ""}"${!eq && META.equipped.length >= ARTIFACT_SLOTS ? " disabled" : ""}>${eq ? "Equipped" : "Equip"}</button>`;
    }
    h += row(a.label, tag, a.desc(Math.max(1, l)), l && l < a.max ? a.desc(l + 1) : "", btns);
  }
  h += `<button class="start" data-menu>Back</button>`;
  $("shop").innerHTML = h;
}
